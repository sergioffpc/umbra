# The `no_std` check of the rendering core (ADR 0014, ADR 0023): see
# `lib.rs`. A workspace member under `checks/`, because it is a check, not
# one of the twelve crates of ADR 0015. Its library has no unit tests or
# doctests: a test harness links `std`, which is what the check rejects.
[package]
name = "no-std-check"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
build = "build/main.rs"

[lib]
path = "lib.rs"
test = false
doctest = false
bench = false

[dependencies]
umbra-math = { workspace = true }
umbra-sampling = { workspace = true }
umbra-spectrum = { workspace = true }
umbra-geometry = { workspace = true }
umbra-shading = { workspace = true }
umbra-camera = { workspace = true }
umbra-integrators = { workspace = true }

[features]
# The Scene arenas as `umbra-scene` builds them; `--all-features` turns it on.
serde = [
  "umbra-math/serde",
  "umbra-sampling/serde",
  "umbra-spectrum/serde",
  "umbra-geometry/serde",
  "umbra-shading/serde",
  "umbra-camera/serde",
  "umbra-integrators/serde",
]

[lints]
workspace = true
