# git-cliff: generates CHANGELOG.md from Conventional Commits.
# https://git-cliff.org/docs/configuration
#
# At release time (on the release/X.Y.Z branch):
#   git cliff --unreleased --tag vX.Y.Z --prepend CHANGELOG.md
# Preview what the next release contains:
#   git cliff --unreleased

[changelog]
header = """
# Changelog

All notable changes to this project are documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).\
"""
# Groups carry a hidden "<!-- N -->" prefix to keep Keep a Changelog order.
body = """
{% if version %}
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}
## [Unreleased]
{% endif %}{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
{% if commit.breaking %}**BREAKING:** {% endif %}\
{{ commit.message | split(pat="\n") | first | upper_first | trim }}\
{% endfor %}
{% endfor %}\
"""
footer = "\n<!-- Generated by git-cliff from commit messages (see cliff.toml); do not edit by hand. -->"
trim = false
# Normalise blank lines: one between blocks, a single newline at the end.
postprocessors = [{ pattern = "\\n{3,}", replace = "\n\n" }, { pattern = "\\n+$", replace = "\n" }]

[git]
conventional_commits = true
# Merge commits and anything else that is not a Conventional Commit.
filter_unconventional = true
split_commits = false
# The changelog lists user-visible changes only; tooling and CI commits are
# skipped unless they are breaking.
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Added" },
  { message = "^(refactor|perf)", group = "<!-- 1 -->Changed" },
  { message = "^revert", group = "<!-- 1 -->Changed" },
  { message = "^fix", group = "<!-- 4 -->Fixed" },
  { message = "^(build|ci|chore|docs|style|test)", skip = true },
]
protect_breaking_commits = true
filter_commits = true
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+$"
topo_order = false
sort_commits = "oldest"
