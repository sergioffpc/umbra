#
# git-cliff configuration: computes the next SemVer version from the
# Conventional Commits since the last release tag, and drafts its
# Keep a Changelog section for CHANGELOG.md.
#
#   git cliff --bumped-version                 # next version, e.g. v0.2.0
#   git cliff --bump --unreleased --strip all  # draft of its section

[changelog]
# Kept identical to the header of CHANGELOG.md.
header = """
# Changelog

All notable changes to this project are documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).
Before 1.0.0, breaking changes bump the minor version.

"""
body = """
{% if version -%}
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
    ## [Unreleased]
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
          {{ commit.message | split(pat="\n") | first | upper_first | trim }}\
    {% endfor %}
{% endfor %}\n
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
# A skip parser below can never drop a breaking change.
protect_breaking_commits = true
# Commits matching no parser (docs, ci, build, ...) stay out of the changelog.
filter_commits = true
# git flow release and hotfix tags.
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+$"
sort_commits = "oldest"
# First match wins; the HTML comments order the sections.
commit_parsers = [
  { field = "breaking", pattern = "true", group = "<!-- 0 -->⚠ Breaking Changes" },
  { message = "^feat", group = "<!-- 1 -->Added" },
  { message = "^fix", group = "<!-- 2 -->Fixed" },
  { message = "^perf", group = "<!-- 3 -->Performance" },
  { message = "^revert", group = "<!-- 4 -->Reverted" },
  { message = ".*", skip = true },
]

[bump]
# feat bumps the minor and fix the patch. A breaking change bumps the minor
# before 1.0.0 and the major from 1.0.0 on; the move to 1.0.0 itself is a
# manual decision (git cliff --bump major).
features_always_bump_minor = true
breaking_always_bump_major = false
# The first release, when no tag exists yet.
initial_tag = "v0.1.0"
