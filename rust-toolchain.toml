# Pinned toolchain. clippy `pedantic`/`cargo` gain new lints with every Rust
# release, so a floating `stable` would break CI without any code change.
# Upgrade deliberately: bump `channel` here and `rust-version` in Cargo.toml in
# the same commit, then fix any new lints. Dependabot does not update this file.
[toolchain]
channel = "1.99.1"
components = ["rustfmt", "clippy", "llvm-tools"]
profile = "minimal"
# Bare-metal target with no `std`: CI builds the seven core crates for it, so
# a dependency on `std` breaks the build (ADR 0014, ADR 0015).
targets = ["aarch64-unknown-none"]
