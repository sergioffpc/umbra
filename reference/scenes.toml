# The pinned pbrt-v4 commits and the Reference Scenes (ADR 0019, ADR 0031,
# arc42 §8.4 and §8.11). Read by `umbra bench`, which measures Umbra on the
# Reference Scenes, and by the benchmark measurement issue, which renders them
# with pbrt-v4 for QS-5.
#
# Moving either commit is an explicit decision. A Reference Scene, once listed,
# is never removed.

[pbrt-v4]
repository = "https://github.com/mmp/pbrt-v4"
commit = "b0bdf461ba5dd6504b70ebf0932acc0fe7aa744f"

[pbrt-v4-scenes]
repository = "https://github.com/mmp/pbrt-v4-scenes"
commit = "30cf4a0346ae5a80a2d7a530a3ef7d0fa4f70572"

# Each Reference Scene fixes resolution, Pixel Samples per pixel, seed and Tile
# size for `umbra bench`, sized for 10–60 s per target machine.
#
# pbrt-v4 has no resolution override, so the benchmark resolution must be the
# one the Scene File (with its edit) declares.
#
# A Reference Scene Variant is an entry with an `edit` table: `find` must occur
# exactly once in its Scene File and is replaced by `replace` before anything
# renders it, pbrt-v4 and Umbra alike.

[[reference-scene]]
name = "killeroo-simple"
scene-file = "killeroos/killeroo-simple.pbrt"
milestone = "v0.1.0"

[reference-scene.benchmark]
resolution = [700, 700]
pixel-samples = 64
seed = 0
tile-size = 32
