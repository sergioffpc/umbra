# Formatting rules. Only stable options are used, like the stable language
# features every crate but `umbra-gpu-programs` keeps to on the pinned
# nightly (ADR 0027).
edition = "2024"
style_edition = "2024"
max_width = 100
newline_style = "Unix"
use_field_init_shorthand = true
use_try_shorthand = true
