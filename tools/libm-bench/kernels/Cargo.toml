# The GPU kernels of the libm benchmark, built for `nvptx64-nvidia-cuda` by
# `scripts/bench-libm.sh` with CUDA's `libdevice` linked in.
[package]
name = "libm-bench-kernels"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace]

[dependencies]
umbra-math = { path = "../../../crates/umbra-math" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
