# Clippy configuration. Lint levels live in `[lints]` in Cargo.toml.

# Apply API-shape lints to public items too; there are no external users yet.
avoid-breaking-exported-api = false

# Tests may unwrap, expect and print freely.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-print-in-tests = true
allow-dbg-in-tests = true

# Small functions that do one thing. Clippy cannot see intent, so these
# thresholds stand in for "one responsibility": short bodies, shallow nesting,
# little branching, few inputs, and enums instead of `bool` parameters or fields.
too-many-lines-threshold = 40
cognitive-complexity-threshold = 10
excessive-nesting-threshold = 3
too-many-arguments-threshold = 5
max-fn-params-bools = 0
max-struct-bools = 0

# `large_stack_frames`: the default (500 KB) only catches frames that would
# already overflow a 2 MiB worker-thread stack. 64 KiB flags big frames early,
# before deep recursion (BVH traversal, path bounces) multiplies them.
stack-size-threshold = 65536

# Numerics (ADR 0022, ADR 0007, ADR 0028). `std`'s transcendental float
# methods are not available in the `no_std` core, and they bypass the one
# place that picks each function's source per target: use `umbra-math`'s own
# kernels, or its safe wrappers of the C functions, which call glibc on
# x86-64 and `libdevice` on `nvptx64`: the `f32` ones at the crate root
# (`umbra_math::tanf`), the `f64` ones in `umbra_math::double`. A wrapper
# named below that does not exist yet is added when first needed. Methods that are
# exact or correctly rounded under IEEE 754 everywhere stay allowed: `sqrt`,
# `mul_add`, `abs`, `floor`, `ceil`, `round`, `trunc`, `min`, `max`, `recip`.
# Approximate-reciprocal intrinsics differ between CPU vendors, and Umbra never
# changes the floating-point control register (no flush-to-zero, no DAZ).
# Applies to tests too: test oracles must be reproducible as well.
# `allow-invalid` keeps paths the toolchain does not expose (AVX-512), and for
# crates that are not dependencies yet, from failing configuration loading.
disallowed-methods = [
  { path = "f32::sin", reason = "C math outside `umbra-math` (ADR 0022): use `umbra_math::sinf`" },
  { path = "f32::cos", reason = "C math outside `umbra-math` (ADR 0022): use `umbra_math::cosf`" },
  { path = "f32::tan", reason = "C math outside `umbra-math` (ADR 0022): use `umbra_math::tanf`" },
  { path = "f32::sin_cos", reason = "C math outside `umbra-math` (ADR 0022): use `umbra_math::sin_cos`" },
  { path = "f32::asin", reason = "C math outside `umbra-math` (ADR 0022): use `umbra_math::asinf`" },
  { path = "f32::acos", reason = "C math outside `umbra-math` (ADR 0022): use `umbra_math::acosf`" },
  { path = "f32::atan", reason = "C math outside `umbra-math` (ADR 0022): use `umbra_math::atanf`" },
  { path = "f32::atan2", reason = "C math outside `umbra-math` (ADR 0022): use `umbra_math::atan2`" },
  { path = "f32::sinh", reason = "C math outside `umbra-math` (ADR 0022): use `umbra_math::sinhf`" },
  { path = "f32::cosh", reason = "C math outside `umbra-math` (ADR 0022): use `umbra_math::coshf`" },
  { path = "f32::tanh", reason = "C math outside `umbra-math` (ADR 0022): use `umbra_math::tanhf`" },
  { path = "f32::asinh", reason = "C math outside `umbra-math` (ADR 0022): use `umbra_math::asinhf`" },
  { path = "f32::acosh", reason = "C math outside `umbra-math` (ADR 0022): use `umbra_math::acoshf`" },
  { path = "f32::atanh", reason = "C math outside `umbra-math` (ADR 0022): use `umbra_math::atanhf`" },
  { path = "f32::exp", reason = "C math outside `umbra-math` (ADR 0022): use `umbra_math::expf`, or `Vec4::exp` for four lanes" },
  { path = "f32::exp2", reason = "C math outside `umbra-math` (ADR 0022): use `umbra_math::exp2f`" },
  { path = "f32::exp_m1", reason = "C math outside `umbra-math` (ADR 0022): use `umbra_math::expm1f`" },
  { path = "f32::ln", reason = "C math outside `umbra-math` (ADR 0022): use `umbra_math::logf`" },
  { path = "f32::log", reason = "C math outside `umbra-math` (ADR 0022): use `umbra_math::logf` and a division" },
  { path = "f32::log2", reason = "C math outside `umbra-math` (ADR 0022): use `umbra_math::log2f`" },
  { path = "f32::log10", reason = "C math outside `umbra-math` (ADR 0022): use `umbra_math::log10f`" },
  { path = "f32::ln_1p", reason = "C math outside `umbra-math` (ADR 0022): use `umbra_math::log1pf`" },
  { path = "f32::powf", reason = "C math outside `umbra-math` (ADR 0022): use `umbra_math::powf`, or `Vec4::pow` for four lanes" },
  { path = "f32::powi", reason = "unspecified precision (ADR 0022): use repeated multiplication or `umbra_math::powf`" },
  { path = "f32::cbrt", reason = "C math outside `umbra-math` (ADR 0022): use `umbra_math::cbrtf`" },
  { path = "f32::hypot", reason = "C math outside `umbra-math` (ADR 0022): use `umbra_math::hypotf`" },
  { path = "f64::sin", reason = "C math outside `umbra-math` (ADR 0022): use `umbra_math::double::sin`" },
  { path = "f64::cos", reason = "C math outside `umbra-math` (ADR 0022): use `umbra_math::double::cos`" },
  { path = "f64::tan", reason = "C math outside `umbra-math` (ADR 0022): use `umbra_math::double::tan`" },
  { path = "f64::sin_cos", reason = "C math outside `umbra-math` (ADR 0022): use `umbra_math::double::sincos`" },
  { path = "f64::asin", reason = "C math outside `umbra-math` (ADR 0022): use `umbra_math::double::asin`" },
  { path = "f64::acos", reason = "C math outside `umbra-math` (ADR 0022): use `umbra_math::double::acos`" },
  { path = "f64::atan", reason = "C math outside `umbra-math` (ADR 0022): use `umbra_math::double::atan`" },
  { path = "f64::atan2", reason = "C math outside `umbra-math` (ADR 0022): use `umbra_math::double::atan2`" },
  { path = "f64::sinh", reason = "C math outside `umbra-math` (ADR 0022): use `umbra_math::double::sinh`" },
  { path = "f64::cosh", reason = "C math outside `umbra-math` (ADR 0022): use `umbra_math::double::cosh`" },
  { path = "f64::tanh", reason = "C math outside `umbra-math` (ADR 0022): use `umbra_math::double::tanh`" },
  { path = "f64::asinh", reason = "C math outside `umbra-math` (ADR 0022): use `umbra_math::double::asinh`" },
  { path = "f64::acosh", reason = "C math outside `umbra-math` (ADR 0022): use `umbra_math::double::acosh`" },
  { path = "f64::atanh", reason = "C math outside `umbra-math` (ADR 0022): use `umbra_math::double::atanh`" },
  { path = "f64::exp", reason = "C math outside `umbra-math` (ADR 0022): use `umbra_math::double::exp`" },
  { path = "f64::exp2", reason = "C math outside `umbra-math` (ADR 0022): use `umbra_math::double::exp2`" },
  { path = "f64::exp_m1", reason = "C math outside `umbra-math` (ADR 0022): use `umbra_math::double::expm1`" },
  { path = "f64::ln", reason = "C math outside `umbra-math` (ADR 0022): use `umbra_math::double::log`" },
  { path = "f64::log", reason = "C math outside `umbra-math` (ADR 0022): use `umbra_math::double::log` and a division" },
  { path = "f64::log2", reason = "C math outside `umbra-math` (ADR 0022): use `umbra_math::double::log2`" },
  { path = "f64::log10", reason = "C math outside `umbra-math` (ADR 0022): use `umbra_math::double::log10`" },
  { path = "f64::ln_1p", reason = "C math outside `umbra-math` (ADR 0022): use `umbra_math::double::log1p`" },
  { path = "f64::powf", reason = "C math outside `umbra-math` (ADR 0022): use `umbra_math::double::pow`" },
  { path = "f64::powi", reason = "unspecified precision (ADR 0022): use repeated multiplication or `umbra_math::double::pow`" },
  { path = "f64::cbrt", reason = "C math outside `umbra-math` (ADR 0022): use `umbra_math::double::cbrt`" },
  { path = "f64::hypot", reason = "C math outside `umbra-math` (ADR 0022): use `umbra_math::double::hypot`" },
  # Approximate reciprocals: results differ between CPU vendors.
  { path = "core::arch::x86_64::_mm_rcp_ps", reason = "vendor-dependent approximate instruction (ADR 0022): use an exact `1.0 / x`", allow-invalid = true },
  { path = "core::arch::x86_64::_mm_rcp_ss", reason = "vendor-dependent approximate instruction (ADR 0022): use an exact `1.0 / x`", allow-invalid = true },
  { path = "core::arch::x86_64::_mm_rsqrt_ps", reason = "vendor-dependent approximate instruction (ADR 0022): use `1.0 / x.sqrt()`", allow-invalid = true },
  { path = "core::arch::x86_64::_mm_rsqrt_ss", reason = "vendor-dependent approximate instruction (ADR 0022): use `1.0 / x.sqrt()`", allow-invalid = true },
  { path = "core::arch::x86_64::_mm256_rcp_ps", reason = "vendor-dependent approximate instruction (ADR 0022): use an exact `1.0 / x`", allow-invalid = true },
  { path = "core::arch::x86_64::_mm256_rsqrt_ps", reason = "vendor-dependent approximate instruction (ADR 0022): use `1.0 / x.sqrt()`", allow-invalid = true },
  { path = "core::arch::x86_64::_mm512_rcp14_ps", reason = "vendor-dependent approximate instruction (ADR 0022): use an exact `1.0 / x`", allow-invalid = true },
  { path = "core::arch::x86_64::_mm512_rsqrt14_ps", reason = "vendor-dependent approximate instruction (ADR 0022): use `1.0 / x.sqrt()`", allow-invalid = true },
  # Floating-point control register: no flush-to-zero, no denormals-are-zero.
  { path = "core::arch::x86_64::_mm_setcsr", reason = "changes FP control state (ADR 0022): keep IEEE defaults", allow-invalid = true },
  { path = "core::arch::x86_64::_MM_SET_FLUSH_ZERO_MODE", reason = "flush-to-zero (ADR 0022): keep IEEE defaults", allow-invalid = true },
  { path = "core::arch::x86_64::_MM_SET_DENORMALS_ZERO_MODE", reason = "denormals-are-zero (ADR 0022): keep IEEE defaults", allow-invalid = true },
]

# `f64` in the core (ADR 0028): consumer GPUs run it at a small fraction of
# `f32`'s rate, and the core is compiled for `nvptx64` too. Only the seven
# core crates enable the lint (`#![warn(clippy::disallowed_types)]` in their
# `lib.rs`; the workspace sets it to `allow`), so the `std` crates (ADR 0001's
# per-pixel sums), tests and build scripts keep `f64`. Inside the core,
# `umbra-math`'s x86-64 backends `#[expect]` it.
disallowed-types = [
  { path = "f64", reason = "no `f64` in the core (ADR 0028): it runs slowly on the GPU; compute in `f32`" },
]

# pbrt-v4 terms and tool names written as prose in doc comments, not code.
# `..` keeps clippy's default list.
doc-valid-idents = [
  "..",
  "BxDF",
  "BxDFs",
  "BSDF",
  "BSDFs",
  "BSSRDF",
  "BSSRDFs",
  "AddressSanitizer",
  "OptiX",
]
