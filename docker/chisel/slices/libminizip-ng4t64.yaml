#
# Chisel slices of libminizip-ng4t64, which canonical/chisel-releases does
# not slice yet, in its format. docker/release.Dockerfile adds this file to
# the pinned chisel-releases tree.
package: libminizip-ng4t64

essential:
  libminizip-ng4t64_copyright:

slices:
  libs:
    essential:
      libc6_libs:
      zlib1g_libs:
    contents:
      /usr/lib/*-linux-*/libminizip-ng.so.4*:

  copyright:
    contents:
      /usr/share/doc/libminizip-ng4t64/copyright:
