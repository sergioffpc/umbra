# The workspace of arc42 §5.1 (ADR 0015): seven `#![no_std]` core crates
# without `alloc` and five `std` crates around them, all in `crates/<name>/`.
# Every crate inherits the package metadata, lints and dependencies below
# (arc42 §5.4).
[workspace]
members = ["crates/*"]
resolver = "3"

# One version for the whole workspace; the Build Identity is the commit
# (ADR 0012). Nothing is published to crates.io.
[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Sérgio Carvalho"]
license = "MIT"
repository = "https://github.com/sergioffpc/umbra"
keywords = ["ray-tracing", "pbr", "rendering", "pbrt", "graphics"]
categories = ["rendering", "graphics", "multimedia::images"]
publish = false

# Every dependency is declared once here and taken with `workspace = true`.
# Core crates use `default-features = false` for every external dependency:
# it must build without `std` (ADR 0014).
[workspace.dependencies]
# Micro-benchmarks: a reference and its optimised kernel side by side in one
# generic bench (arc42 §8.4, ADR 0007).
divan = "0.1.21"
serde = { version = "1.0.228", default-features = false }
umbra-camera = { path = "crates/umbra-camera" }
umbra-cluster = { path = "crates/umbra-cluster" }
umbra-geometry = { path = "crates/umbra-geometry" }
umbra-integrators = { path = "crates/umbra-integrators" }
umbra-math = { path = "crates/umbra-math" }
umbra-parser = { path = "crates/umbra-parser" }
umbra-render = { path = "crates/umbra-render" }
umbra-sampling = { path = "crates/umbra-sampling" }
umbra-scene = { path = "crates/umbra-scene" }
umbra-shading = { path = "crates/umbra-shading" }
umbra-spectrum = { path = "crates/umbra-spectrum" }

# Development builds: optimised enough that test renders finish, with full
# debug info and every runtime check (debug assertions, overflow checks) on.
[profile.dev]
opt-level = 1
debug = "full"
debug-assertions = true
overflow-checks = true

# Dependencies are compiled once, so optimise them fully even in dev.
[profile.dev.package."*"]
opt-level = 3

# Build scripts too: `umbra-spectrum`'s optimises the RGB-to-spectrum table
# (ADR 0022), about a CPU-minute optimised and twenty unoptimised. The
# `package."*"` table above already covers those of dependencies, so this
# reaches the workspace's own.
[profile.dev.build-override]
opt-level = 3

# Release: maximum runtime performance at the cost of build time.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
incremental = false
debug = "line-tables-only"
strip = "none"

# As in dev: the RGB-to-spectrum table is optimised by a build script.
[profile.release.build-override]
opt-level = 3

# Release performance with full debug info, for profilers (samply,
# perf) that need inlined frames and source lines.
# Use: cargo build --profile profiling
[profile.profiling]
inherits = "release"
debug = "full"

# Release performance with debug assertions and overflow checks back on, to
# validate long renders that are too slow in dev. Use: --profile checked
[profile.checked]
inherits = "release"
debug-assertions = true
overflow-checks = true
panic = "unwind"

# Lints are set to `warn` so local builds keep compiling while iterating; the
# pre-commit hook and CI run with `-D warnings`, so every warning blocks a merge.
[workspace.lints.rust]
# Least privilege: every item is private unless it must be public. `pub` that is
# not reachable from outside the crate must be `pub(crate)` (`unreachable_pub`),
# and anything that is public must carry docs (`missing_docs`).
missing_debug_implementations = "warn"
missing_docs = "warn"
redundant_imports = "warn"
redundant_lifetimes = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unreachable_pub = "warn"
unit_bindings = "warn"
# `unsafe` is denied by default. An exception is an aggressive optimisation
# (ADR 0007): `#[expect(unsafe_code, reason = "...")]` on the narrowest item.
# Never `forbid`, which would make exceptions impossible.
unsafe_code = "deny"
unused_import_braces = "warn"
unused_lifetimes = "warn"
unused_macro_rules = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
# Geometry code is full of x, y, z, u, v, t; this lint fights that.
many_single_char_names = "allow"
# Transitive duplicates are outside our control.
multiple_crate_versions = "allow"
# `f64` is banned in the core only (ADR 0028): `clippy.toml` lists it, and the
# seven core crates turn the lint on in their `lib.rs`. Lint levels cannot
# differ between crates that inherit `[lints]`, hence the attribute there.
disallowed_types = "allow"
# One thing per function: thresholds are set in clippy.toml. `too_many_lines`,
# `too_many_arguments` and `fn_params_excessive_bools` come from the groups above.
cognitive_complexity = "warn"
excessive_nesting = "warn"
# Least privilege for fields: no struct with a mix of public and private fields.
partial_pub_fields = "warn"
# Selected restriction lints.
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
clone_on_ref_ptr = "warn"
dbg_macro = "warn"
empty_structs_with_brackets = "warn"
float_cmp_const = "warn"
get_unwrap = "warn"
# Nursery: prefer hypot, ln_1p, exp_m1 etc. for numerical accuracy, taken from
# `umbra-math`'s C math wrappers: the `std` methods are in `disallowed-methods` in
# clippy.toml (ADR 0022), which `all` enables. The sibling
# `suboptimal_flops` is left off: it pushes `mul_add`, which is a slow libm
# call on targets built without FMA.
imprecise_flops = "warn"
if_then_some_else_none = "warn"
lossy_float_literal = "warn"
mem_forget = "warn"
missing_assert_message = "warn"
mod_module_files = "warn"
multiple_unsafe_ops_per_block = "warn"
# Output goes through `tracing` and the JSON report, never `println!`.
print_stderr = "warn"
print_stdout = "warn"
rc_buffer = "warn"
rest_pat_in_fully_bound_structs = "warn"
str_to_string = "warn"
todo = "warn"
# Every `unsafe` block carries a `// SAFETY:` comment, and only `unsafe` code
# does (ADR 0007).
undocumented_unsafe_blocks = "warn"
unimplemented = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
unwrap_used = "warn"
# Performance. The `perf` group (via `all`) and the perf-minded pedantic lints
# (`large_types_passed_by_value`, `trivially_copy_pass_by_ref`,
# `inefficient_to_string`, `format_push_string`, ...) are already on; these are
# the nursery and restriction lints that catch wasted work but sit outside them.
# Nursery: needless allocations and clones.
iter_on_empty_collections = "warn"
iter_on_single_items = "warn"
iter_with_drain = "warn"
needless_collect = "warn"
or_fun_call = "warn"
redundant_clone = "warn"
set_contains_or_insert = "warn"
string_lit_as_bytes = "warn"
unused_peekable = "warn"
# Nursery: stack size (threshold in clippy.toml) and lock hold times.
large_stack_frames = "warn"
significant_drop_in_scrutinee = "warn"
significant_drop_tightening = "warn"
# Restriction: an assert up front lets LLVM drop per-index bounds checks.
missing_asserts_for_indexing = "warn"
# Restriction: atomics instead of `Mutex<bool>` / `Mutex<usize>`.
mutex_atomic = "warn"
mutex_integer = "warn"
# Restriction: cheaper equivalents.
string_lit_chars_any = "warn"
verbose_file_reads = "warn"
# Exhaustive dispatch: no `_` arm in a `match` on an enum, so a new `*Kind`
# variant breaks the build wherever it is ignored (ADR 0006). The sibling
# `match_wildcard_for_single_variants` comes from `pedantic`.
wildcard_enum_match_arm = "warn"
