[package]
name = "umbra"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "A physically based ray tracer inspired by pbrt-v4, written in Rust"
authors = ["Sérgio Carvalho"]
license = "MIT"
repository = "https://github.com/sergioffpc/umbra"
readme = "README.md"
keywords = ["ray-tracing", "pbr", "rendering", "pbrt", "graphics"]
categories = ["rendering", "graphics", "multimedia::images"]

[dependencies]

# Development builds: optimised enough that test renders finish, with full
# debug info and every runtime check (debug assertions, overflow checks) on.
[profile.dev]
opt-level = 1
debug = "full"
debug-assertions = true
overflow-checks = true

# Dependencies are compiled once, so optimise them fully even in dev.
[profile.dev.package."*"]
opt-level = 3

# Release: maximum runtime performance at the cost of build time.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
incremental = false
debug = "line-tables-only"
strip = "none"

# Release performance with full debug info, for profilers (samply,
# Instruments, perf) that need inlined frames and source lines.
# Use: cargo build --profile profiling
[profile.profiling]
inherits = "release"
debug = "full"

# Release performance with debug assertions and overflow checks back on, to
# validate long renders that are too slow in dev. Use: --profile checked
[profile.checked]
inherits = "release"
debug-assertions = true
overflow-checks = true
panic = "unwind"

# Lints are set to `warn` so local builds keep compiling while iterating; the
# pre-commit hook and CI run with `-D warnings`, so every warning blocks a merge.
[lints.rust]
# Least privilege: every item is private unless it must be public. `pub` that is
# not reachable from outside the crate must be `pub(crate)` (`unreachable_pub`),
# and anything that is public must carry docs (`missing_docs`).
missing_debug_implementations = "warn"
missing_docs = "warn"
redundant_imports = "warn"
redundant_lifetimes = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unreachable_pub = "warn"
unit_bindings = "warn"
unsafe_code = "deny"
unused_import_braces = "warn"
unused_lifetimes = "warn"
unused_macro_rules = "warn"
unused_qualifications = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
# Geometry code is full of x, y, z, u, v, t; this lint fights that.
many_single_char_names = "allow"
# Transitive duplicates are outside our control.
multiple_crate_versions = "allow"
# One thing per function: thresholds are set in clippy.toml. `too_many_lines`,
# `too_many_arguments` and `fn_params_excessive_bools` come from the groups above.
cognitive_complexity = "warn"
excessive_nesting = "warn"
# Least privilege for fields: no struct with a mix of public and private fields.
partial_pub_fields = "warn"
# Selected restriction lints.
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
clone_on_ref_ptr = "warn"
dbg_macro = "warn"
empty_structs_with_brackets = "warn"
float_cmp_const = "warn"
get_unwrap = "warn"
# Nursery: prefer hypot, ln_1p, exp_m1 etc. for numerical accuracy. The sibling
# `suboptimal_flops` is left off: it pushes `mul_add`, which is a slow libm
# call on targets built without FMA.
imprecise_flops = "warn"
if_then_some_else_none = "warn"
lossy_float_literal = "warn"
mem_forget = "warn"
missing_assert_message = "warn"
mod_module_files = "warn"
multiple_unsafe_ops_per_block = "warn"
rc_buffer = "warn"
rest_pat_in_fully_bound_structs = "warn"
str_to_string = "warn"
todo = "warn"
undocumented_unsafe_blocks = "warn"
unimplemented = "warn"
unwrap_used = "warn"
