# Repository tooling, run with `cargo xtask <task>` (alias in .cargo/config.toml).
# Its own workspace, so the product workspace stays the twelve crates of
# arc42 §5.1 and the core's dependency policy never sees `syn`.
[workspace]

[package]
name = "xtask"
description = "Repository tooling for umbra: the book-citation check and book map (QS-4)"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
authors = ["Sérgio Carvalho"]
license = "MIT"
repository = "https://github.com/sergioffpc/umbra"
publish = false

[dependencies]
proc-macro2 = { version = "1.0.103", default-features = false, features = ["span-locations"] }
syn = { version = "2.0.111", default-features = false, features = ["full", "parsing", "printing"] }

# The product workspace's lints cannot be inherited across workspaces; these
# are its groups and the restriction lints that matter for a small tool.
[lints.rust]
missing_debug_implementations = "warn"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"
unsafe_code = "deny"
unused_qualifications = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
print_stderr = "warn"
print_stdout = "warn"
str_to_string = "warn"
unwrap_used = "warn"
wildcard_enum_match_arm = "warn"
