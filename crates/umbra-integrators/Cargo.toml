[package]
name = "umbra-integrators"
description = "SceneView, the per-Pixel-Sample body of each integrator, the Recorder trait"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true

[features]
# Derives `Serialize`/`Deserialize` for the Scene arena types, for Scene
# replication (ADR 0015). Off by default; `umbra-scene` turns it on.
serde = ["dep:serde", "umbra-shading/serde", "umbra-camera/serde"]

[dependencies]
serde = { workspace = true, optional = true }
umbra-camera = { workspace = true }
umbra-shading = { workspace = true }

[lints]
workspace = true
