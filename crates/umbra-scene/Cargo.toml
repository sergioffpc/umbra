[package]
name = "umbra-scene"
description = "Owning Scene (arenas), SceneBuilder, deterministic BVH construction, RenderJobOptions"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true
publish.workspace = true

[dependencies]
# The Scene's builder and the Render Job Options travel to every Worker
# (arc42 §8.13): the core crates' `serde` features derive their types.
serde = { workspace = true, features = ["derive"] }
thiserror = { workspace = true }
umbra-camera = { workspace = true, features = ["serde"] }
umbra-geometry = { workspace = true, features = ["serde"] }
umbra-integrators = { workspace = true, features = ["serde"] }
umbra-math = { workspace = true, features = ["serde"] }
umbra-sampling = { workspace = true, features = ["serde"] }
umbra-spectrum = { workspace = true }

[lints]
workspace = true
