[package]
name = "umbra-shading"
description = "Textures, Materials, BxDFs, Lights and light samplers, Media, each with its *Kind"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true
publish.workspace = true

[features]
# Derives `Serialize`/`Deserialize` for the Scene arena types, for Scene
# replication (ADR 0015). Off by default; `umbra-scene` turns it on.
serde = ["dep:serde", "umbra-geometry/serde", "umbra-spectrum/serde"]

[dependencies]
serde = { workspace = true, optional = true }
umbra-geometry = { workspace = true }
umbra-spectrum = { workspace = true }

[lints]
workspace = true
