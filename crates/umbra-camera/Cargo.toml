[package]
name = "umbra-camera"
description = "Cameras and CameraKind, Filters, sensor RGB, camera sample generation"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true
publish.workspace = true

[features]
# Derives `Serialize`/`Deserialize` for the Scene arena types, for Scene
# replication (ADR 0015). Off by default; `umbra-scene` turns it on.
serde = [
  "dep:serde",
  "umbra-geometry/serde",
  "umbra-math/serde",
  "umbra-sampling/serde",
  "umbra-spectrum/serde",
]

[dependencies]
serde = { workspace = true, optional = true }
umbra-geometry = { workspace = true }
umbra-math = { workspace = true }
umbra-sampling = { workspace = true }
umbra-spectrum = { workspace = true }

[lints]
workspace = true
