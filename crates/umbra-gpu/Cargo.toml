[package]
name = "umbra-gpu"
description = "The GPU Worker's renderer, host side: cudarc, the OptiX host side, and the PTX of umbra-gpu-programs"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true
publish.workspace = true
# Compiles `umbra-gpu-programs` for `nvptx64` and links `libdevice` into its
# PTX (ADR 0028, ADR 0033).
build = "build.rs"

[features]
# `Tracer::evaluate` and `MathFunction`, which evaluate umbra-math's
# functions on the GPU, with the math program in the PTX and the pipeline:
# for the GPU tests alone (#146), which turn it on by the dev-dependency on
# this crate below. Off in production.
math-program = ["umbra-gpu-programs/math-program"]
# The PTX of the libm bench's kernels, which the build script compiles
# beside the programs', for `benches/libm.rs` alone. Off in production.
libm-bench = []

[dependencies]
cudarc = { workspace = true }
libloading = { workspace = true }
thiserror = { workspace = true }
umbra-geometry = { workspace = true }
umbra-integrators = { workspace = true }
# The layout the host shares with the device (ADR 0033); its programs are
# built for `nvptx64` by the build script, not by this dependency.
umbra-gpu-programs = { workspace = true }
umbra-math = { workspace = true }
umbra-render = { workspace = true }
umbra-sampling = { workspace = true }
umbra-scene = { workspace = true }
umbra-spectrum = { workspace = true }

[dev-dependencies]
# The CPU's Renderer, which the GPU's is compared with (`tests/gpu/renderer.rs`).
umbra-cpu = { workspace = true }
# `Ptx`, which loads the libm bench's kernels into a plain CUDA module; the
# library itself loads its PTX through OptiX.
cudarc = { workspace = true, features = ["nvrtc"] }
# This crate with the math program, for the GPU tests (`tests/gpu/libdevice.rs`).
umbra-gpu = { path = ".", features = ["math-program"] }
# Reads the Scene Files the GPU tests render.
umbra-parser = { workspace = true }

# What libm costs on the GPU, the counterpart of `umbra-math`'s
# `benches/libm.rs`, with the report the math guide plots.
[[bench]]
name = "libm"
harness = false
required-features = ["libm-bench"]

[lints]
workspace = true
