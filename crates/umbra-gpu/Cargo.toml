[package]
name = "umbra-gpu"
description = "The GPU Worker's renderer: cudarc, the OptiX host side, and the PTX of umbra-kernels"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true
publish.workspace = true
# Compiles `umbra-kernels` for `nvptx64` and links `libdevice` into its PTX
# (ADR 0028).
build = "build.rs"

[features]
# `Tracer::evaluate` and `MathFunction`, which evaluate umbra-math's
# functions on the GPU, with the math program in the PTX and the pipeline:
# for the GPU tests alone (#146), which turn it on by the dev-dependency on
# this crate below. Off in production.
math-program = []

[dependencies]
cudarc = { workspace = true }
libloading = { workspace = true }
thiserror = { workspace = true }
umbra-geometry = { workspace = true }
umbra-math = { workspace = true }

[dev-dependencies]
# This crate with the math program, for the GPU tests (`tests/gpu/libdevice.rs`).
umbra-gpu = { path = ".", features = ["math-program"] }

[lints]
workspace = true
