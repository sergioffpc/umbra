[package]
name = "umbra"
description = "A physically based ray tracer inspired by pbrt-v4, written in Rust"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true
publish.workspace = true

[dependencies]
clap = { workspace = true }
ctrlc = { workspace = true }
indicatif = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-tracy = { workspace = true, optional = true }
umbra-cluster = { workspace = true }
umbra-parser = { workspace = true }
umbra-render = { workspace = true }
umbra-scene = { workspace = true }

[features]
# Sends the `tracing` spans to Tracy (arc42 §8.4); off by default.
tracy = ["dep:tracing-tracy"]

[dev-dependencies]
dhat = { workspace = true }
image = { workspace = true }
indicatif = { workspace = true, features = ["in_memory"] }
rayon = { workspace = true }
umbra-cpu = { workspace = true }
umbra-math = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
