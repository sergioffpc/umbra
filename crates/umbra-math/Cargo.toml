[package]
name = "umbra-math"
description = "Vectors, points, normals, frames, transforms, Interval and floating-point error bounds, libm wrappers"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true
publish.workspace = true

[features]
# Derives `Serialize`/`Deserialize` for the Scene arena types, for Scene
# replication (ADR 0015). Off by default; `umbra-scene` turns it on.
serde = ["dep:serde"]

[dependencies]
libm = { workspace = true }
serde = { workspace = true, optional = true, features = ["derive"] }

[dev-dependencies]
divan = { workspace = true }

[[bench]]
name = "kernels"
harness = false

# The transcendentals from the `libm` crate, Umbra and glibc (issue #138).
# glibc is linked by this target and its tests only, never by the library.
[[bench]]
name = "transcendentals"
harness = false

[lints]
workspace = true
