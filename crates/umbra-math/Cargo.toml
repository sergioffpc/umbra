[package]
name = "umbra-math"
description = "Vectors, points, normals, frames, transforms, Interval and floating-point error bounds, libm wrappers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true

[features]
# Derives `Serialize`/`Deserialize` for the Scene arena types, for Scene
# replication (ADR 0015). Off by default; `umbra-scene` turns it on.
serde = ["dep:serde"]

[dependencies]
serde = { workspace = true, optional = true }

