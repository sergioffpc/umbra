[package]
name = "umbra-math"
description = "Vectors, points, normals, frames, transforms, Interval and floating-point error bounds, C math wrappers"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true
publish.workspace = true

[features]
# Derives `Serialize`/`Deserialize` for the Scene arena types, for Scene
# replication (ADR 0015). Off by default; `umbra-scene` turns it on.
serde = ["dep:serde"]

[dependencies]
serde = { workspace = true, optional = true, features = ["derive"] }

[dev-dependencies]
divan = { workspace = true }

[[bench]]
name = "kernels"
harness = false

# What libm costs: umbra-math's 19 C functions against glibc's and the best
# SIMD, with the report the math guide plots (`benches/libm.rs`). `libmvec`
# is loaded by this target only, never by the library.
[[bench]]
name = "libm"
harness = false

[lints]
workspace = true
