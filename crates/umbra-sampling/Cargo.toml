[package]
name = "umbra-sampling"
description = "Sampling functions (warps), hashing and RNG, low-discrepancy sequences, Sampler and SamplerKind"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true
publish.workspace = true

[features]
# Derives `Serialize`/`Deserialize` for the Scene arena types, for Scene
# replication (ADR 0015). Off by default; `umbra-scene` turns it on.
serde = ["dep:serde", "umbra-math/serde"]

[dependencies]
serde = { workspace = true, optional = true }
umbra-math = { workspace = true }

[lints]
workspace = true
