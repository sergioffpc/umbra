[package]
name = "umbra-spectrum"
description = "Spectrum and SpectrumKind, SampledSpectrum, SampledWavelengths, RGB and color spaces"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true
publish.workspace = true
# Generates the sRGB RGB-to-spectrum table (ADR 0022).
build = "build/main.rs"

[features]
# Derives `Serialize`/`Deserialize` for the Scene arena types, for Scene
# replication (ADR 0015). Off by default; `umbra-scene` turns it on.
serde = ["dep:serde", "umbra-math/serde", "umbra-sampling/serde"]

[dependencies]
serde = { workspace = true, optional = true, features = ["derive"] }
umbra-math = { workspace = true }
umbra-sampling = { workspace = true }

[lints]
workspace = true
