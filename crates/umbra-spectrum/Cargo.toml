[package]
name = "umbra-spectrum"
description = "Spectrum and SpectrumKind, SampledSpectrum, SampledWavelengths, RGB and color spaces"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true

[features]
# Derives `Serialize`/`Deserialize` for the Scene arena types, for Scene
# replication (ADR 0015). Off by default; `umbra-scene` turns it on.
serde = ["dep:serde", "umbra-sampling/serde"]

[dependencies]
serde = { workspace = true, optional = true }
umbra-sampling = { workspace = true }

[lints]
workspace = true
