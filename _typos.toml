# typos: source-code spell checker, run by the pre-commit hook and CI.
# https://github.com/crate-ci/typos/blob/master/docs/reference.md

[default.extend-words]
# Accept a word flagged as a typo, e.g. domain terms or identifiers:
# word = "word"
# Multiple importance sampling (PBR 4e §2.2.3).
MIS = "MIS"

[files]
extend-exclude = []
