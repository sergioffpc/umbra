# Local build settings.
#
# target-cpu=native lets LLVM use every SIMD extension of the build machine
# (AVX2/AVX-512 on x86-64, the full NEON/SVE set on Apple silicon), which
# matters for a renderer. Binaries built this way may not run on older CPUs:
# for a distributable build, override it, e.g.
#   RUSTFLAGS="-C target-cpu=x86-64-v3" cargo build --release
# The RUSTFLAGS environment variable replaces this list, so CI (which sets
# RUSTFLAGS=-D warnings) builds portable code.
[build]
rustflags = ["-C", "target-cpu=native"]

[alias]
# Repository tooling in xtask/, its own workspace: `cargo xtask book-map`.
xtask = "run --quiet --locked --manifest-path xtask/Cargo.toml --"
# Test coverage with cargo-llvm-cov and nextest. Add `--open` to view the HTML
# report, or `--lcov --output-path lcov.info` for editor gutters.
cov = "llvm-cov nextest --all-features --locked --no-tests=warn"
