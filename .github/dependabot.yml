version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
  # Repository tooling (xtask/), a workspace of its own.
  - package-ecosystem: cargo
    directory: /xtask
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
  # Release image: the Ubuntu base digest in the root Dockerfile. The Chisel
  # version and checksums there are bumped by hand.
  - package-ecosystem: docker
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: build
  # Dev container: the base image and features (.devcontainer/).
  - package-ecosystem: docker
    directory: /.devcontainer
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: build
  - package-ecosystem: devcontainers
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: build
