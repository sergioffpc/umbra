version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    # One pull request per ecosystem and week, not one per dependency.
    groups:
      all:
        patterns: ["*"]
    commit-message:
      prefix: build
      include: scope
  # The workflows and the composite actions under .github/actions/.
  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/*"]
    target-branch: develop
    schedule:
      interval: weekly
    # One pull request per ecosystem and week, not one per dependency.
    groups:
      all:
        patterns: ["*"]
    commit-message:
      prefix: ci
  # Release and CI image: the Ubuntu base digest in the root Dockerfile. The
  # Chisel version and checksums there are bumped by hand.
  - package-ecosystem: docker
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    # One pull request per ecosystem and week, not one per dependency.
    groups:
      all:
        patterns: ["*"]
    commit-message:
      prefix: build
  # Dev container: the base image and features (.devcontainer/).
  - package-ecosystem: docker
    directory: /.devcontainer
    target-branch: develop
    schedule:
      interval: weekly
    # One pull request per ecosystem and week, not one per dependency.
    groups:
      all:
        patterns: ["*"]
    commit-message:
      prefix: build
  - package-ecosystem: devcontainers
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    # One pull request per ecosystem and week, not one per dependency.
    groups:
      all:
        patterns: ["*"]
    commit-message:
      prefix: build
