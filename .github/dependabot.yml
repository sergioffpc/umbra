version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
  # Dev container: the base image and features (.devcontainer/).
  - package-ecosystem: docker
    directory: /.devcontainer
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: build
  - package-ecosystem: devcontainers
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: build
