name: CI image
description: >-
  Builds the `ci` stage of the Dockerfile into the local image store as
  `umbra-ci`, its layers cached in the GitHub Actions cache, and restores the
  job's cargo registry and target directory. Then
  `scripts/in-ci-image.sh scripts/check.sh <group>` runs a check group in it.

inputs:
  cache-key:
    description: Name of the job's cargo cache (its target directory).
    required: true

runs:
  using: composite
  steps:
    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    # Only the `toolchain` and `ci` stages are built: a change to the crates
    # does not rebuild the image, a change to rust-toolchain.toml or the tool
    # versions in scripts/install-tools.sh does. Every Rust job builds it with
    # the same cache scope, so all but the first read every layer from it.
    - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        target: ci
        platforms: linux/amd64
        load: true
        tags: umbra-ci
        cache-from: type=gha,scope=ci-image
        cache-to: type=gha,scope=ci-image,mode=max
        # Lifts GitHub's rate limit on the cargo-nextest download.
        secrets: github_token=${{ github.token }}

    # The cargo registry and the target directory, bind-mounted into the
    # container by scripts/in-ci-image.sh. Per job, since each builds with its
    # own flags. Saved only when the toolchain or Cargo.lock changes, as
    # Swatinem/rust-cache did, so it holds the dependencies, and a new
    # Cargo.lock or toolchain starts from the previous cache.
    - uses: actions/cache@v6
      with:
        path: |
          ${{ runner.temp }}/cargo/registry
          ${{ runner.temp }}/cargo/target
        key: >-
          cargo-${{ inputs.cache-key }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
        restore-keys: |
          cargo-${{ inputs.cache-key }}-

    - name: Point scripts/in-ci-image.sh at the image and the cache
      shell: bash
      run: |
        mkdir -p "$RUNNER_TEMP/cargo/registry" "$RUNNER_TEMP/cargo/target"
        {
          echo "UMBRA_CI_IMAGE=umbra-ci"
          echo "UMBRA_CI_REGISTRY=$RUNNER_TEMP/cargo/registry"
          echo "UMBRA_CI_TARGET=$RUNNER_TEMP/cargo/target"
        } >>"$GITHUB_ENV"
