#
# Fails when an ELF file under the given paths needs a GCC runtime
# (libstdc++, libgcc_s or GCC's libatomic) or has an unresolved dependency:
# everything umbra builds and ships uses the LLVM runtimes only. The rule
# lives in check.sh, next to this file.
name: No GCC runtime
description: Check that no ELF file under some paths needs a GCC runtime.

inputs:
  paths:
    description: Space-separated files or directories to check.
    required: true
  image:
    description: >-
      Container image to run the check in, the paths being paths inside it;
      empty to check the job's own file system (its container, if any).
    required: false
    default: ""

runs:
  using: composite
  steps:
    - shell: bash
      env:
        TARGETS: ${{ inputs.paths }}
        IMAGE: ${{ inputs.image }}
      run: |
        set -euo pipefail
        read -ra paths <<<"$TARGETS"
        check="$GITHUB_ACTION_PATH/check.sh"
        if [[ -n "$IMAGE" ]]; then
          docker run --rm -i "$IMAGE" bash -s -- "${paths[@]}" <"$check"
        else
          bash "$check" "${paths[@]}"
        fi
