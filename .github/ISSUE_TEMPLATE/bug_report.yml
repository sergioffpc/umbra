name: Bug report
description: Report something that renders incorrectly, crashes or misbehaves.
title: "fix: "
labels: ["bug", "needs-triage"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Commands, scene files or code needed to reproduce the issue.
      placeholder: |
        1. cargo run --release -- scene.pbrt
        2. ...
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: Error messages, logs, or rendered images (drag and drop to attach).
  - type: input
    id: version
    attributes:
      label: Umbra version or commit
      placeholder: v0.1.0 or a commit SHA
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, CPU/GPU, and output of `rustc --version`.
    validations:
      required: true
