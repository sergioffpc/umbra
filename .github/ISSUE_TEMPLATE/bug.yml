name: Bug report
description: Report something that does not work as expected.
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Only the devcontainer is supported, so
        please reproduce the problem inside it before filing. Security issues
        must be reported privately (see SECURITY.md), not here.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect to happen instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Exact commands run inside the devcontainer, starting from a clean checkout.
      placeholder: |
        1. python3 -m forge build
        2. ...
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Relevant output
      description: Logs, compiler diagnostics or sanitizer reports.
      render: shell
  - type: input
    id: commit
    attributes:
      label: Commit
      description: Output of `git rev-parse HEAD`.
    validations:
      required: true
  - type: textarea
    id: version
    attributes:
      label: Version information
      description: Output of `umbra` (the three-line version block), if it builds.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I reproduced the problem inside the devcontainer.
          required: true
        - label: I searched existing issues for duplicates.
          required: true
        - label: I agree to follow this project's Code of Conduct.
          required: true
