#
# Builds the prebuilt container image layers when their inputs change, or on
# manual dispatch (e.g. on a Dependabot branch, whose token is read-only).
# Each layer is tagged with a hash of its inputs (python3 -m forge layer-image,
# forge/layer_image.py) and skipped when that tag is already published. The
# deps image is built on the toolchain image, and the devcontainer pins it:
# when the pinned tag differs, this workflow commits the new pin to the branch.
# Either way it then dispatches CI on the branch, whose image jobs fail until
# the pinned image is published. Its logic is in forge commands, run on the
# runner or, through docker run on a read-only mount of the checkout, inside
# the image they check; the other steps are actions, docker push and the
# warnings of a read-only token.
name: deps

on:
  push:
    paths:
      - .gitmodules
      - third_party/**
      - docker/**
      - forge/**
      - checks/git.py
      - .github/workflows/deps.yml
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a running layer build: its progress is only kept in the cache
# when the build step ends on its own.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  # Cache mount of docker/toolchain.Dockerfile holding the LLVM build tree.
  TOOLCHAIN_CACHE_ID: umbra-toolchain-build
  TOOLCHAIN_CACHE_TARGET: /var/cache/umbra-build
  # Cache mount of docker/deps.Dockerfile holding the ccache of the
  # dependency build, and the private image that carries it between runs.
  DEPS_CCACHE_ID: umbra-deps-ccache
  DEPS_CCACHE_TARGET: /var/cache/ccache
  DEPS_CCACHE_PACKAGE: umbra-deps-ccache

jobs:
  toolchain:
    runs-on: ubuntu-26.04
    timeout-minutes: 360
    permissions:
      contents: read
      packages: write
    env:
      # Dependabot's token is read-only: its runs build and verify the image
      # but cannot publish it. Dispatch the workflow manually on such a
      # branch instead.
      CAN_WRITE: ${{ github.actor != 'dependabot[bot]' }}
    outputs:
      ref: ${{ steps.image.outputs.ref }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compute image tag
        id: image
        run: python3 -m forge layer-image toolchain

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check whether the image exists
        id: published
        env:
          REF: ${{ steps.image.outputs.ref }}
        run: python3 -m forge published "${REF}"

      # Source mtimes are set to each submodule's commit time so that a build
      # tree restored from the cache is newer than the sources and ninja
      # resumes instead of rebuilding everything.
      - name: Check out submodules
        if: steps.published.outputs.exists == 'false'
        run: python3 -m forge checkout-submodules --layer toolchain --touch

      - name: Set up Buildx
        id: buildx
        if: steps.published.outputs.exists == 'false'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Restore the LLVM build tree
        id: cache
        if: steps.published.outputs.exists == 'false'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/toolchain-build
          key: toolchain-build-${{ steps.image.outputs.tag }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: toolchain-build-${{ steps.image.outputs.tag }}-

      # Copies the restored tree into the BuildKit cache mount the Dockerfile
      # builds in.
      - name: Load the LLVM build tree into BuildKit
        if: steps.cache.outputs.cache-matched-key != ''
        env:
          BUILDER: ${{ steps.buildx.outputs.name }}
          CACHE_DIR: ${{ runner.temp }}/toolchain-build
        run: >-
          python3 -m forge buildkit-cache load --builder "${BUILDER}"
          --id "${TOOLCHAIN_CACHE_ID}" --target "${TOOLCHAIN_CACHE_TARGET}"
          --from-dir "${CACHE_DIR}"

      # The step timeout leaves the job time to save the build tree: a step
      # that times out fails, so the steps below still run.
      - name: Build the image
        id: build
        if: steps.published.outputs.exists == 'false'
        timeout-minutes: 300
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/toolchain.Dockerfile
          target: toolchain
          builder: ${{ steps.buildx.outputs.name }}
          load: true
          push: false
          provenance: false
          sbom: false
          tags: ${{ steps.image.outputs.ref }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Save the LLVM build tree from BuildKit
        if: >-
          always() && steps.published.outputs.exists == 'false'
          && steps.buildx.outcome == 'success' && steps.build.outcome != 'success'
        env:
          BUILDER: ${{ steps.buildx.outputs.name }}
          CACHE_DIR: ${{ runner.temp }}/toolchain-build
        run: >-
          python3 -m forge buildkit-cache save --builder "${BUILDER}"
          --id "${TOOLCHAIN_CACHE_ID}" --target "${TOOLCHAIN_CACHE_TARGET}"
          --to-dir "${CACHE_DIR}"

      # Saved only when the build did not finish: a published image makes the
      # build tree useless.
      - name: Cache the LLVM build tree
        if: >-
          always() && steps.published.outputs.exists == 'false'
          && steps.buildx.outcome == 'success' && steps.build.outcome != 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/toolchain-build
          key: ${{ steps.cache.outputs.cache-primary-key }}

      # No ELF file of the toolchain may need a GCC runtime, and every
      # dependency must resolve. Like the verification below, forge runs in the
      # image, on a read-only mount of the checkout, and writes no bytecode
      # there.
      - name: No GCC runtime in the toolchain
        if: steps.published.outputs.exists == 'false'
        env:
          REF: ${{ steps.image.outputs.ref }}
        run: >-
          docker run --rm -e GITHUB_ACTIONS -v "${PWD}:/src:ro" -w /src "${REF}"
          python3 -B -m forge no-gcc-runtime /usr/local /opt/python-tools

      # The tools and runtimes of the toolchain, and test programs that use only
      # the LLVM runtimes.
      - name: Verify the toolchain
        if: steps.published.outputs.exists == 'false'
        env:
          REF: ${{ steps.image.outputs.ref }}
        run: >-
          docker run --rm -e GITHUB_ACTIONS -v "${PWD}:/src:ro" -w /src "${REF}"
          python3 -B -m forge verify-toolchain

      - name: Report a read-only token
        if: steps.published.outputs.exists == 'false' && env.CAN_WRITE != 'true'
        run: >-
          echo "::warning::The token of this run is read-only, so the toolchain
          image is not published. Run the deps workflow manually on this
          branch."

      - name: Publish the image
        if: steps.published.outputs.exists == 'false' && env.CAN_WRITE == 'true'
        env:
          REF: ${{ steps.image.outputs.ref }}
        run: docker push "${REF}"

      # A container image version is one manifest per tag here (no provenance
      # or SBOM manifests), so this keeps the five most recent tags.
      - name: Prune old images
        if: steps.published.outputs.exists == 'false' && env.CAN_WRITE == 'true'
        uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5.0.0
        with:
          package-name: umbra-toolchain
          package-type: container
          min-versions-to-keep: 5

  deps:
    needs: toolchain
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    permissions:
      actions: write # dispatches CI on the pin commit
      contents: write # the devcontainer pin commit
      packages: write
    env:
      # Dependabot's token is read-only: its runs build and verify the image
      # but can neither publish nor pin it. Dispatch the workflow manually on
      # such a branch instead.
      CAN_WRITE: ${{ github.actor != 'dependabot[bot]' }}
    outputs:
      ref: ${{ steps.image.outputs.ref }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compute image tag
        id: image
        run: python3 -m forge layer-image deps

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check whether the image exists
        id: published
        env:
          REF: ${{ steps.image.outputs.ref }}
        run: python3 -m forge published "${REF}"

      - name: Check out submodules
        if: steps.published.outputs.exists == 'false'
        run: python3 -m forge checkout-submodules --layer deps

      - name: Set up Buildx
        id: buildx
        if: steps.published.outputs.exists == 'false'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # The ccache of the dependency build lives in an image,
      # ghcr.io/<owner>/$DEPS_CCACHE_PACKAGE:latest, not in the Actions cache,
      # which is scoped to a branch: the runs on develop find their image
      # published and build nothing, so a new branch would never see the cache
      # of the previous one. Every branch reads and writes the latest tag; the
      # build is correct whatever the cache holds. This copies the cache image,
      # if any, into the BuildKit cache mount the Dockerfile builds in.
      - name: Load the compiler cache into BuildKit
        if: steps.published.outputs.exists == 'false'
        env:
          BUILDER: ${{ steps.buildx.outputs.name }}
        run: >-
          python3 -m forge buildkit-cache load --builder "${BUILDER}"
          --id "${DEPS_CCACHE_ID}" --target "${DEPS_CCACHE_TARGET}"
          --from-package "${DEPS_CCACHE_PACKAGE}"

      - name: Build the image
        id: build
        if: steps.published.outputs.exists == 'false'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/deps.Dockerfile
          target: deps
          build-args: TOOLCHAIN_IMAGE=${{ needs.toolchain.outputs.ref }}
          builder: ${{ steps.buildx.outputs.name }}
          load: true
          push: false
          provenance: false
          sbom: false
          tags: ${{ steps.image.outputs.ref }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      # The toolchain's rule, extended to the dependencies: no ELF file under
      # the prefix may need a GCC runtime, and every dependency must resolve.
      - name: No GCC runtime in the dependencies
        if: steps.published.outputs.exists == 'false'
        env:
          REF: ${{ steps.image.outputs.ref }}
        run: >-
          docker run --rm -e GITHUB_ACTIONS -v "${PWD}:/src:ro" -w /src "${REF}"
          python3 -B -m forge no-gcc-runtime /opt/umbra

      # No library of the dependencies may link the CUDA driver, except the
      # modules loaded at run time.
      - name: No libcuda in the dependencies
        if: steps.published.outputs.exists == 'false'
        env:
          REF: ${{ steps.image.outputs.ref }}
        run: >-
          docker run --rm -e GITHUB_ACTIONS -v "${PWD}:/src:ro" -w /src "${REF}"
          python3 -B -m forge no-libcuda /opt/umbra

      # Saved even when the build failed: what it compiled is still valid.
      - name: Save the compiler cache
        if: >-
          always() && steps.published.outputs.exists == 'false'
          && env.CAN_WRITE == 'true' && steps.buildx.outcome == 'success'
          && steps.build.outcome != 'skipped'
        env:
          BUILDER: ${{ steps.buildx.outputs.name }}
        run: >-
          python3 -m forge buildkit-cache save --builder "${BUILDER}"
          --id "${DEPS_CCACHE_ID}" --target "${DEPS_CCACHE_TARGET}"
          --to-package "${DEPS_CCACHE_PACKAGE}"

      # One manifest per version, without provenance or SBOM manifests: those
      # would be untagged versions that the tagged image needs, and this step
      # would delete them.
      - name: Prune old compiler caches
        if: >-
          always() && steps.published.outputs.exists == 'false'
          && env.CAN_WRITE == 'true' && steps.buildx.outcome == 'success'
          && steps.build.outcome != 'skipped'
        uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5.0.0
        with:
          package-name: ${{ env.DEPS_CCACHE_PACKAGE }}
          package-type: container
          min-versions-to-keep: 1
          delete-only-untagged-versions: true

      - name: Report a read-only token
        if: env.CAN_WRITE != 'true'
        run: >-
          echo "::warning::The token of this run is read-only, so the image is
          neither published nor pinned. Run the deps workflow manually on this
          branch."

      - name: Publish the image
        if: steps.published.outputs.exists == 'false' && env.CAN_WRITE == 'true'
        env:
          REF: ${{ steps.image.outputs.ref }}
        run: docker push "${REF}"

      - name: Prune old images
        if: steps.published.outputs.exists == 'false' && env.CAN_WRITE == 'true'
        uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5.0.0
        with:
          package-name: umbra-deps
          package-type: container
          min-versions-to-keep: 5

      # The pin commit is created through the GraphQL API instead of pushed,
      # so GitHub signs it. It goes on top of the branch's current head and
      # edits the file as it is there; a deps run for a newer head re-pins
      # after this one (the runs of a branch never overlap). Commits made with
      # this token start no workflow runs, except workflow_dispatch, so the
      # step dispatches CI on the branch: its jobs then report on the pin
      # commit, the head of the branch's pull request. When the branch already
      # pins the image, CI is dispatched all the same: the image may have been
      # missing when CI ran for this head.
      - name: Pin the devcontainer image
        if: github.ref_type == 'branch' && env.CAN_WRITE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ steps.image.outputs.ref }}
          TAG: ${{ steps.image.outputs.tag }}
          BRANCH: ${{ github.ref_name }}
        run: >-
          python3 -m forge pin-devcontainer --ref "${REF}" --tag "${TAG}"
          --branch "${BRANCH}"
