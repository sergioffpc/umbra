name: Rust

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # `umbra-math` requires the `x86-64-v3` baseline (ADR 0023), and the CI
  # runners are generic x86-64.
  RUSTFLAGS: -D warnings -C target-cpu=x86-64-v3

# CI is split into workflows by kind of check, so the checks of a pull request
# are listed in groups: Rust (this one), Dependencies (dependencies.yml) and
# Lint (lint.yml).
#
# Job names are required status checks in the "Require CI checks" repository
# ruleset: when renaming or adding a job, in any of these workflows, update
# the ruleset too, or merges into develop and main stay blocked.
#
# The checks themselves live in scripts/check.sh, which contributors run
# locally too, and the tool versions in scripts/install-tools.sh, which the
# dev container uses too. Third-party actions are pinned to a commit SHA (tags
# can be moved); Dependabot updates the SHA and the version comment together.
jobs:
  # Whether the change touches anything the Rust jobs read: the crates (their
  # READMEs are their rustdoc, with doctests), the workspace and toolchain
  # configuration, the check scripts or the workflows. A pull request that
  # touches none of it, such as one with documentation only, skips `check`
  # and `miri`, and a skipped job passes as a required status check. On a pull
  # request the checkout is the merge commit, whose first parent is the base
  # branch, so `HEAD^1` to `HEAD` is exactly what the pull request changes. A
  # push to develop or main runs everything.
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          RUST_PATHS: >-
            ^(crates/|scripts/|\.cargo/|\.config/|\.github/workflows/|Cargo\.(toml|lock)$|rust-toolchain\.toml$|clippy\.toml$|rustfmt\.toml$)
        run: |
          if [ "$EVENT" != pull_request ] ||
            git diff --name-only HEAD^1 HEAD | grep -qE "$RUST_PATHS"; then
            echo rust=true >>"$GITHUB_OUTPUT"
          else
            echo rust=false >>"$GITHUB_OUTPUT"
          fi

  # `check` and `miri` run unless `changes` succeeded and found nothing for
  # them, so a failure of `changes` runs them rather than skipping them.
  check:
    name: fmt, clippy, doc, test
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.rust == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Installs the toolchain pinned in rust-toolchain.toml.
      - name: Toolchain
        run: rustup toolchain install && rustc --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: scripts/install-tools.sh cargo-nextest
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # The tests include the hash of the RGB-to-spectrum table the
      # `umbra-spectrum` build script generates (ADR 0022).
      - run: scripts/check.sh rust

  # The `unsafe` SIMD backends of `umbra-math` under Miri (ADR 0007), on the
  # nightly pinned in rust-toolchain.toml (ADR 0027), with the `x86-64-v3`
  # baseline the crate requires. The equivalence tests sample fewer inputs
  # under `cfg(miri)`. Miri cannot run inline assembly, which `libm` uses for
  # its runtime CPU check, so `libm` is built with `force-soft-floats` (the
  # same, correctly rounded bits). The pbrt-v4 test ports are left out: their
  # long loops take hours under Miri, and the equivalence tests cover every
  # `unsafe` item.
  miri:
    name: miri
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.rust == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The toolchain pinned in rust-toolchain.toml, plus Miri.
      - name: Toolchain
        run: >-
          rustup toolchain install && rustup component add miri rust-src &&
          rustc --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: miri
      - run: scripts/install-tools.sh cargo-nextest
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: >-
          cargo miri nextest run -p umbra-math --all-features
          --features libm/force-soft-floats --locked
          -E 'not test(/^pbrt_v4::/)'
