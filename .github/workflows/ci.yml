name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main, develop]
  # The deps workflow dispatches CI on a branch after committing its image
  # pin, since that commit starts no run. The pull request jobs then look up
  # the open pull request of the branch.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Runs directly on the runner: it needs only Python 3 and the GitHub API,
  # not the toolchain image. On a dispatched run (after the deps workflow pins
  # the image) it checks the open pull request of the branch, if any.
  conventions:
    if: >-
      github.event_name == 'pull_request'
      || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The devcontainer must pin the deps image built from the current
      # inputs. The deps workflow builds that image and commits the pin.
      - name: Compute the deps image tag
        id: deps-image
        uses: ./.github/actions/layer-image
        with:
          layer: deps

      - name: Devcontainer image pin
        env:
          REF: ${{ steps.deps-image.outputs.ref }}
          PIN_FILE: .devcontainer/devcontainer.json
        run: |
          pinned=$(sed -nE 's/^[[:space:]]*"image":[[:space:]]*"([^"]*)".*$/\1/p' "$PIN_FILE")
          if [[ "$pinned" != "$REF" ]]; then
            echo "::error file=$PIN_FILE::the pinned image '${pinned:-none}' is stale; the deps inputs hash to $REF. Let the deps workflow publish and pin it (or run it: gh workflow run deps.yml --ref <branch>), then pull."
            exit 1
          fi
          echo "$PIN_FILE pins $REF."

      # The pull request of the event, or on a dispatched run the open pull
      # request whose head is the branch. Without one, the pull request
      # checks below are skipped.
      - name: Pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
          EVENT_PR: ${{ toJSON(github.event.pull_request) }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            pr=$(jq -c '{number, title, base: .base.ref, head: .head.ref,
              author: .user.login}' <<<"$EVENT_PR")
          else
            pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" \
              --state open --limit 1 --json number,title,baseRefName,author \
              --jq '.[] | {number, title, base: .baseRefName,
                head: env.BRANCH, author: .author.login}')
          fi
          if [[ -z "$pr" ]]; then
            echo "::notice title=No pull request::$BRANCH has no open pull" \
              "request: the branch name, title and commit checks are skipped"
            exit 0
          fi
          for key in number title base head author; do
            echo "$key=$(jq -r ".$key" <<<"$pr")" >>"$GITHUB_OUTPUT"
          done
          echo "Pull request #$(jq -r .number <<<"$pr"): $(jq -r .title <<<"$pr")"

      # Dependabot names its branches dependabot/<ecosystem>/<dependency>.
      - name: Branch name
        if: >-
          steps.pr.outputs.number != ''
          && steps.pr.outputs.author != 'dependabot[bot]'
        env:
          HEAD_REF: ${{ steps.pr.outputs.head }}
        run: python3 -m checks.branch_name --pull-request "$HEAD_REF"

      # Features and bugfixes are squash-merged: the title becomes the commit
      # header on develop.
      - name: Pull request title
        if: steps.pr.outputs.number != ''
        env:
          PR_TITLE: ${{ steps.pr.outputs.title }}
        run: printf '%s\n' "$PR_TITLE" | python3 -m checks.commit_message -

      - name: Pull request commits
        if: steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          HEAD_REF: ${{ steps.pr.outputs.head }}
          BASE_REF: ${{ steps.pr.outputs.base }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/commits" \
            --jq '.[] | @json' > "$RUNNER_TEMP/commits.jsonl"
          python3 - "$RUNNER_TEMP/commits.jsonl" <<'EOF'
          """Validates the pull request commits listed in a JSON Lines file.

          Each line is a commit object of the GitHub pull request commits endpoint.
          Every commit must have a signature that GitHub verified, and be a
          Conventional Commit carrying its author's Developer Certificate of Origin
          sign-off; bots (Dependabot, the submodules workflow) are exempt from the
          sign-off. Merge commits are allowed only in release and hotfix pull
          requests into main (the git flow back-merges), and are not checked.

          Usage: python3 - COMMITS_JSONL (with BASE_REF and HEAD_REF set)
          """

          import json
          import os
          import sys

          from checks import commit_message
          from checks import report

          # The pull request commits endpoint lists at most 250 commits.
          MAX_COMMITS = 250


          def commit_errors(
              commit: dict, scopes: frozenset[str], merges_allowed: bool
          ) -> list[str]:
              """Returns the errors of one commit.

              Args:
                  commit: The commit object of the GitHub API.
                  scopes: The scopes a commit header may use.
                  merges_allowed: Whether merge commits are allowed.

              Returns:
                  The human-readable errors; empty when the commit is valid.
              """
              sha = commit["sha"][:12]
              message = commit["commit"]["message"]
              header = message.split("\n", 1)[0]
              errors = []
              verification = commit["commit"]["verification"]
              if not verification["verified"]:
                  reason = verification["reason"]
                  errors.append(f"signature not verified by GitHub ({reason})")
              if len(commit["parents"]) > 1:
                  if not merges_allowed:
                      errors.append("merge commits are not allowed; rebase instead")
              else:
                  login = (commit.get("author") or {}).get("login") or ""
                  author = None
                  if not login.endswith("[bot]"):
                      author = commit["commit"]["author"]["email"]
                  errors.extend(
                      commit_message.validate(message.strip(), scopes, author=author)
                  )
              return [f"{sha} {header!r}: {error}" for error in errors]


          def main() -> int:
              """Validates the commits of the file given on the command line.

              Returns:
                  The process exit status: 0 when every commit is valid, 1 otherwise.
              """
              with open(sys.argv[1], encoding="utf-8") as lines:
                  commits = [json.loads(line) for line in lines if line.strip()]
              merges_allowed = os.environ["BASE_REF"] == "main" and os.environ[
                  "HEAD_REF"
              ].startswith(("release/", "hotfix/"))
              scopes = commit_message.allowed_scopes()
              errors = []
              if len(commits) >= MAX_COMMITS:
                  errors.append(
                      f"the pull request has {len(commits)} commits or more; "
                      f"only the first {MAX_COMMITS} can be verified"
                  )
              for commit in commits:
                  errors.extend(commit_errors(commit, scopes, merges_allowed))
              return report.fail("invalid pull request commits", errors)


          if __name__ == "__main__":
              sys.exit(main())
          EOF

  # Checks third_party/versions.md against the submodule commits recorded in
  # the tree and against the upstream release tags, and every license against
  # the allow-list. Runs directly on the runner: it needs only git.
  third-party:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Licenses are SPDX expressions, compared whole.
      - name: Versions manifest and licenses
        env:
          MANIFEST: third_party/versions.md
          ALLOWED_LICENSES: |-
            Apache-2.0
            Apache-2.0 WITH LLVM-exception
            BSD-2-Clause
            BSD-3-Clause
            MIT
            Zlib
            BSL-1.0
            LicenseRef-TOST-1.0
        run: |
          set -euo pipefail
          status=0
          fail() { echo "::error file=$MANIFEST::$*"; status=1; }
          cell() {
            local value=${1//\`/}
            value=${value#"${value%%[![:space:]]*}"}
            printf '%s' "${value%"${value##*[![:space:]]}"}"
          }

          # Table rows whose Path cell is code: | Name | `path` | ... |
          declare -A tags=() commits=() licenses=()
          while IFS='|' read -r _ name path tag commit license _; do
            path=$(cell "$path")
            if [[ -n "${tags[$path]+set}" ]]; then
              fail "$path is listed more than once"
            fi
            tags[$path]=$(cell "$tag")
            commits[$path]=$(cell "$commit")
            licenses[$path]=$(cell "$license")
            echo "Manifest: $(cell "$name") $path ${tags[$path]} ${commits[$path]} ${licenses[$path]}"
          done < <(grep -E '^\|[^|]*\|[[:space:]]*`' "$MANIFEST")

          # Every gitlink of the tree is a submodule listed in the manifest.
          declare -A gitlinks=()
          while read -r _ type sha path; do
            if [[ "$type" == commit ]]; then
              gitlinks[$path]=$sha
            fi
          done < <(git ls-tree -r HEAD)
          for path in "${!gitlinks[@]}"; do
            [[ -n "${tags[$path]+set}" ]] \
              || fail "submodule $path is missing from the manifest"
          done

          for path in "${!tags[@]}"; do
            tag=${tags[$path]}
            commit=${commits[$path]}
            license=${licenses[$path]}
            if ! grep -Fxq -- "$license" <<<"$ALLOWED_LICENSES"; then
              fail "$path: license '$license' is not on the allow-list"
            fi
            if [[ -z "${gitlinks[$path]+set}" ]]; then
              fail "$path is listed but is not a submodule"
              continue
            fi
            if [[ "$commit" != "${gitlinks[$path]}" ]]; then
              fail "$path: the manifest says $commit, the submodule is at ${gitlinks[$path]}"
            fi
            # The tag must exist upstream and point to that commit (peeled
            # when annotated).
            url=$(git config -f .gitmodules --get-regexp '^submodule\..*\.path$' \
              | awk -v p="$path" '$2 == p { print $1 }' \
              | sed -E 's/\.path$/.url/' | xargs -r git config -f .gitmodules --get || true)
            if [[ -z "$url" ]]; then
              fail "$path has no URL in .gitmodules"
              continue
            fi
            upstream=$(git ls-remote --tags "$url" "refs/tags/$tag" "refs/tags/$tag^{}" \
              | sort -k2 | awk 'END { print $1 }')
            if [[ -z "$upstream" ]]; then
              fail "$path: tag $tag does not exist in $url"
            elif [[ "$upstream" != "$commit" ]]; then
              fail "$path: tag $tag points to $upstream, not $commit"
            fi
          done
          exit "$status"

  # On release and hotfix pull requests: the version in the branch name must
  # equal the CMake project version and git-cliff's bumped version, and
  # CHANGELOG.md must have a dated section for it; every release tag must be
  # signed. git-cliff comes from the pinned deps image.
  release:
    if: >-
      (github.event_name == 'pull_request'
       || github.event_name == 'workflow_dispatch')
      && (startsWith(github.head_ref || github.ref_name, 'release/')
          || startsWith(github.head_ref || github.ref_name, 'hotfix/'))
    needs: image
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.image.outputs.ref }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      # The whole history and the tags: git-cliff bumps from the last tag.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      # The job runs as root on a checkout owned by the runner's user, which
      # git and git-cliff refuse unless it is trusted.
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Versions, changelog and tags
        shell: bash
        env:
          HEAD_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          status=0
          fail() { echo "::error::$*"; status=1; }
          version=${HEAD_REF#*/}
          echo "Branch version: $version"

          cmake_version=
          if [[ -f CMakeLists.txt ]]; then
            cmake_version=$(tr '\n' ' ' <CMakeLists.txt | sed -nE \
              's/.*project\([[:space:]]*umbra[[:space:]][^)]*VERSION[[:space:]]+([0-9]+\.[0-9]+\.[0-9]+).*/\1/p')
          fi
          if [[ -z "$cmake_version" ]]; then
            fail "CMakeLists.txt declares no 'project(umbra VERSION X.Y.Z ...)'"
          elif [[ "$cmake_version" != "$version" ]]; then
            fail "the CMake project version is $cmake_version, the branch says $version"
          fi

          if ! bumped=$(git cliff --bumped-version); then
            fail "git cliff --bumped-version failed"
          elif [[ "${bumped#v}" != "$version" ]]; then
            fail "git-cliff bumps to ${bumped#v}, the branch says $version"
          fi

          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            fail "v$version is already tagged"
          fi

          heading="## [$version] - "
          date=$(grep -F -- "$heading" CHANGELOG.md | head -n1 \
            | cut -c$((${#heading} + 1))- || true)
          if [[ -z "$date" ]]; then
            fail "CHANGELOG.md has no '## [$version] - YYYY-MM-DD' section"
          elif ! [[ "$date" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] \
              || [[ "$(date -d "$date" +%F 2>/dev/null)" != "$date" ]]; then
            fail "the CHANGELOG.md section of $version has an invalid date: '$date'"
          fi

          # Only the presence of a signature is checked: no allowed-signers
          # file is committed.
          while read -r tag; do
            if [[ "$(git cat-file -t "$tag")" != tag ]]; then
              fail "release tag $tag is lightweight, so it is not signed"
            elif ! git cat-file tag "$tag" \
                | grep -Eq -- '^-----BEGIN (SSH|PGP) SIGNATURE-----$'; then
              fail "release tag $tag is not signed"
            fi
          done < <(git tag --list 'v[0-9]*.[0-9]*.[0-9]*')

          exit "$status"

  # Resolves the deps image pinned in the devcontainer configuration, so that
  # the build jobs run in it, and fails clearly when it is not published yet.
  image:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: read
    outputs:
      ref: ${{ steps.pin.outputs.ref }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pinned image
        id: pin
        env:
          PIN_FILE: .devcontainer/devcontainer.json
        run: |
          set -euo pipefail
          image_line='^[[:space:]]*"image":[[:space:]]*"([^"]*)".*$'
          ref=$(sed -nE "s/$image_line/\\1/p" "$PIN_FILE")
          if [[ -z "$ref" ]]; then
            echo "::error file=$PIN_FILE::no \"image\" line with the pinned image"
            exit 1
          fi
          if ! docker manifest inspect "$ref" >/dev/null 2>&1; then
            echo "::error title=Image missing::$ref is not published:" \
              "run the deps workflow on this branch to build it, then re-run CI"
            exit 1
          fi
          echo "ref=$ref" >>"$GITHUB_OUTPUT"

  build-debug:
    needs: image
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.image.outputs.ref }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and test
        run: make test

      # The image carries nvcc and the OptiX headers, so UMBRA_GPU (AUTO)
      # builds the GPU module; its tests need a GPU and run on GPU hosts only.
      - name: GPU module
        run: |
          if [[ ! -f build/debug/lib/libumbra-gpu.so ]]; then
            echo "::error::the GPU module was not built (UMBRA_GPU)"
            exit 1
          fi

      - name: No GCC runtime
        uses: ./.github/actions/no-gcc-runtime
        with:
          paths: build/debug

      - name: No libcuda
        uses: ./.github/actions/no-libcuda
        with:
          paths: build/debug

  build-release:
    needs: image
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.image.outputs.ref }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and test
        run: make release

      # The image carries nvcc and the OptiX headers, so UMBRA_GPU (AUTO)
      # builds the GPU module; its tests need a GPU and run on GPU hosts only.
      - name: GPU module
        run: |
          if [[ ! -f build/release/lib/libumbra-gpu.so ]]; then
            echo "::error::the GPU module was not built (UMBRA_GPU)"
            exit 1
          fi

      - name: No GCC runtime
        uses: ./.github/actions/no-gcc-runtime
        with:
          paths: build/release

      - name: No libcuda
        uses: ./.github/actions/no-libcuda
        with:
          paths: build/release

  # ASan + UBSan (with pattern auto-var-init). As in the devcontainer, ptrace
  # and an unconfined seccomp profile let LeakSanitizer stop the process.
  sanitize-address:
    needs: image
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.image.outputs.ref }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --cap-add SYS_PTRACE --security-opt seccomp=unconfined
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and test
        run: make __asan

      - name: No GCC runtime
        uses: ./.github/actions/no-gcc-runtime
        with:
          paths: build/asan

      - name: No libcuda
        uses: ./.github/actions/no-libcuda
        with:
          paths: build/asan

  # TSan + the UBSan integer, conversion and nullability checks (with pattern
  # auto-var-init). The unconfined seccomp profile lets TSan re-execute itself
  # with address space randomization disabled when the runner's randomization
  # is too strong for its memory layout.
  sanitize-thread:
    needs: image
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.image.outputs.ref }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --cap-add SYS_PTRACE --security-opt seccomp=unconfined
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and test
        run: make __tsan

      - name: No GCC runtime
        uses: ./.github/actions/no-gcc-runtime
        with:
          paths: build/tsan

      - name: No libcuda
        uses: ./.github/actions/no-libcuda
        with:
          paths: build/tsan

  # Fails when `make format` would change any file (the formatting step of
  # `make checks`).
  format:
    needs: image
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.image.outputs.ref }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The job runs as root on a checkout owned by the runner's user.
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Formatting
        run: make __format-check

  # The shared validators (SPDX, NOLINT, SAFETY, assume-nonnull, namespaces),
  # then clang-tidy, the clang-query rules, pylint, actionlint and the checks
  # of the Python embedded in the workflows.
  lint:
    needs: image
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.image.outputs.ref }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The job runs as root on a checkout owned by the runner's user.
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Validators
        run: make __validators

      - name: Lint
        run: make __lint

  # The target graph (modules, executables, tests) must be acyclic. CMake
  # accepts cycles between static libraries, so tsort checks the graph that
  # CMake writes.
  modules:
    needs: image
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.image.outputs.ref }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Module graph
        shell: bash
        run: |
          set -euo pipefail
          graph=build/graph
          cmake --preset debug --graphviz="$graph/umbra.dot" >/dev/null
          # Each dependency edge ends in a comment: // <target> -> <target>.
          sed -nE 's|^[[:space:]]*"node[0-9]+" -> "node[0-9]+".*// (.+) -> (.+)$|\1 \2|p' \
            "$graph/umbra.dot" >"$graph/edges"
          echo "Dependencies:"
          sed 's/^/  /' "$graph/edges"
          if ! tsort "$graph/edges" >/dev/null 2>"$graph/cycle"; then
            echo "::error title=Module cycle::the target graph has a cycle:" \
              "$(sed -n 's/^tsort: //p' "$graph/cycle" | tail -n +2 | xargs)"
            exit 1
          fi
          echo "The target graph is acyclic."
