name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main, develop]
  # The deps workflow dispatches CI on a branch after committing its image
  # pin, since that commit starts no run. The pull request jobs then look up
  # the open pull request of the branch.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Runs directly on the runner: it needs only Python 3 and the GitHub API,
  # not the toolchain image. On a dispatched run (after the deps workflow pins
  # the image) it checks the open pull request of the branch, if any.
  conventions:
    if: >-
      github.event_name == 'pull_request'
      || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The devcontainer must pin the deps image built from the current
      # inputs. The deps workflow builds that image and commits the pin.
      - name: Compute the deps image tag
        id: deps-image
        run: python3 -m forge layer-image deps

      - name: Devcontainer image pin
        env:
          REF: ${{ steps.deps-image.outputs.ref }}
        run: python3 -m forge pin --ref "$REF"

      # The pull request of the event, or on a dispatched run the open pull
      # request whose head is the branch: its branch name (Dependabot's
      # dependabot/<ecosystem>/<dependency> branches are exempt), its title
      # (features and bugfixes are squash-merged: the title becomes the commit
      # header on develop) and its commits. Without one, the checks are
      # skipped.
      - name: Pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -m forge pull-request

  # Checks third_party/versions.md against the submodule commits recorded in
  # the tree and against the upstream release tags, and every license against
  # the allow-list. Runs directly on the runner: it needs only Python 3 and
  # git.
  third-party:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Licenses are SPDX expressions, compared whole.
      - name: Versions manifest and licenses
        run: python3 -m forge third-party

  # On release and hotfix pull requests: the version in the branch name must
  # equal the CMake project version and git-cliff's bumped version, and
  # CHANGELOG.md must have a dated section for it; every release tag must be
  # signed. git-cliff comes from the pinned deps image.
  release:
    if: >-
      (github.event_name == 'pull_request'
       || github.event_name == 'workflow_dispatch')
      && (startsWith(github.head_ref || github.ref_name, 'release/')
          || startsWith(github.head_ref || github.ref_name, 'hotfix/'))
    needs: image
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.image.outputs.ref }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      # The whole history and the tags: git-cliff bumps from the last tag.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      # The job runs as root on a checkout owned by the runner's user, which
      # git and git-cliff refuse unless it is trusted.
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Versions, changelog and tags
        run: python3 -m forge release

  # Whether a pull request changes more than documentation: Markdown files and
  # docs/. One that does not skips the image job and so every job that runs in
  # the image (build, sanitizers, format, lint, modules); GitHub counts a
  # skipped required check as passed. The files are those of the whole pull
  # request, renames counted by both names. Pushes and dispatched runs always
  # build.
  changes:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.files.outputs.code }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Changed files
        id: files
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -m forge changes

  # Resolves the deps image pinned in the devcontainer configuration, so that
  # the build jobs run in it, and fails clearly when it is not published yet.
  image:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: read
    outputs:
      ref: ${{ steps.pin.outputs.ref }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pinned image
        id: pin
        run: python3 -m forge image

  build-debug:
    needs: image
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.image.outputs.ref }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and test
        run: python3 -m forge check --preset debug

      # The image carries nvcc and the OptiX headers, so UMBRA_GPU (AUTO)
      # builds the GPU module; its tests need a GPU and run on GPU hosts only.
      # No binary needs a GCC runtime, nor the CUDA driver unless it is a
      # module loaded at run time.
      - name: Build tree
        run: python3 -m forge audit --preset debug

  build-release:
    needs: image
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.image.outputs.ref }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and test
        run: python3 -m forge check --preset release

      # The image carries nvcc and the OptiX headers, so UMBRA_GPU (AUTO)
      # builds the GPU module; its tests need a GPU and run on GPU hosts only.
      # No binary needs a GCC runtime, nor the CUDA driver unless it is a
      # module loaded at run time.
      - name: Build tree
        run: python3 -m forge audit --preset release

  # On release and hotfix pull requests: builds the release image
  # (docker/release.Dockerfile) on the pinned deps image, without publishing
  # it, and checks its contract and that it starts, without network: every
  # run loads the libraries umbra links, and devices and render also
  # initialize each dependency, which loads OpenUSD's plugins, and load the
  # GPU module, which without a GPU reports CUDA's error. The runner has no
  # GPU, so the GPU path is not checked.
  release-image:
    if: >-
      (github.event_name == 'pull_request'
       || github.event_name == 'workflow_dispatch')
      && (startsWith(github.head_ref || github.ref_name, 'release/')
          || startsWith(github.head_ref || github.ref_name, 'hotfix/'))
    needs: image
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: read
    env:
      IMAGE: umbra:release-check
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        id: buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/release.Dockerfile
          target: release
          build-args: DEPS_IMAGE=${{ needs.image.outputs.ref }}
          builder: ${{ steps.buildx.outputs.name }}
          load: true
          push: false
          provenance: false
          sbom: false
          tags: ${{ env.IMAGE }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      # The user, entrypoint, command and working directory of the contract,
      # a file system without a shell, a package manager or any program but
      # umbra, and umbra starting in it.
      - name: Contract and start
        run: python3 -m forge release-image "$IMAGE"

  # ASan + UBSan (with pattern auto-var-init). As in the devcontainer, ptrace
  # and an unconfined seccomp profile let LeakSanitizer stop the process.
  sanitize-address:
    needs: image
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.image.outputs.ref }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --cap-add SYS_PTRACE --security-opt seccomp=unconfined
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and test
        run: python3 -m forge check-asan

      # No binary needs a GCC runtime, nor the CUDA driver unless it is a
      # module loaded at run time.
      - name: Build tree
        run: python3 -m forge audit --preset asan

  # TSan + the UBSan integer, conversion and nullability checks (with pattern
  # auto-var-init). The unconfined seccomp profile lets TSan re-execute itself
  # with address space randomization disabled when the runner's randomization
  # is too strong for its memory layout.
  sanitize-thread:
    needs: image
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.image.outputs.ref }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --cap-add SYS_PTRACE --security-opt seccomp=unconfined
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and test
        run: python3 -m forge check-tsan

      # No binary needs a GCC runtime, nor the CUDA driver unless it is a
      # module loaded at run time.
      - name: Build tree
        run: python3 -m forge audit --preset tsan

  # Fails when the formatters would change any file.
  format:
    needs: image
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.image.outputs.ref }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The job runs as root on a checkout owned by the runner's user.
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Formatting
        run: python3 -m forge format --check

  # The shared validators (SPDX, NOLINT, SAFETY, assume-nonnull, namespaces),
  # then clang-tidy, the clang-query rules, pylint, actionlint and the checks
  # of the Python embedded in the workflows.
  lint:
    needs: image
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.image.outputs.ref }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The job runs as root on a checkout owned by the runner's user.
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Lint
        run: python3 -m forge lint

  # The target graph (modules, executables, tests) must be acyclic. CMake
  # accepts cycles between static libraries, so forge checks the graph that
  # CMake writes.
  modules:
    needs: image
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.image.outputs.ref }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Module graph
        run: python3 -m forge modules
