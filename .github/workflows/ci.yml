name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

# Third-party actions are pinned to a commit SHA (tags can be moved);
# Dependabot updates the SHA and the version comment together.
jobs:
  check:
    name: fmt, clippy, doc, test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Linux x86-64 and macOS on Apple silicon: catches floating-point and
        # SIMD differences between AVX and NEON code paths.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Installs the toolchain pinned in rust-toolchain.toml.
      - name: Toolchain
        run: rustup toolchain install && rustc --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Whitespace
        if: github.event_name == 'pull_request' && runner.os == 'Linux'
        run: git diff --check origin/${{ github.base_ref }}...HEAD
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - run: cargo doc --no-deps --document-private-items --all-features --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo test --all-features --locked

  deny:
    name: cargo deny (${{ matrix.checks }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        checks: [advisories, bans licenses sources]
    # A new advisory can appear at any time without a code change; report it
    # without blocking unrelated pull requests.
    continue-on-error: ${{ matrix.checks == 'advisories' }}
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check ${{ matrix.checks }}

  typos:
    name: typos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: crate-ci/typos@4c8b7f51ca60df14e3c5ca82770dfbbe6c3dae85 # v1.52.0
