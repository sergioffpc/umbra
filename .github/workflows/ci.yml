name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Runs directly on the runner: it needs only Python 3 and the GitHub API,
  # not the toolchain image.
  conventions:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Dependabot names its branches dependabot/<ecosystem>/<dependency>.
      - name: Branch name
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: python3 -m checks.branch_name --pull-request "$HEAD_REF"

      # Features and bugfixes are squash-merged: the title becomes the commit
      # header on develop.
      - name: Pull request title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | python3 -m checks.commit_message -

      - name: Pull request commits
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/commits" \
            --jq '.[] | @json' > "$RUNNER_TEMP/commits.jsonl"
          python3 - "$RUNNER_TEMP/commits.jsonl" <<'EOF'
          import json
          import os
          import sys

          from checks import commit_message
          from checks.report import fail

          # The pull request commits endpoint lists at most 250 commits.
          MAX_COMMITS = 250

          with open(sys.argv[1], encoding="utf-8") as lines:
              commits = [json.loads(line) for line in lines if line.strip()]

          # git flow back-merges main into develop with merge commits, so a
          # release or hotfix pull request into main may carry them; every
          # other history must be linear.
          merges_allowed = os.environ["BASE_REF"] == "main" and os.environ[
              "HEAD_REF"
          ].startswith(("release/", "hotfix/"))
          scopes = commit_message.allowed_scopes()

          errors = []
          if len(commits) >= MAX_COMMITS:
              errors.append(
                  f"the pull request has {len(commits)} commits or more; "
                  f"only the first {MAX_COMMITS} can be verified"
              )
          for commit in commits:
              sha = commit["sha"][:12]
              message = commit["commit"]["message"]
              header = message.split("\n", 1)[0]
              verification = commit["commit"]["verification"]
              if not verification["verified"]:
                  errors.append(
                      f"{sha} {header!r}: signature not verified by GitHub "
                      f"({verification['reason']})"
                  )
              if len(commit["parents"]) > 1:
                  if not merges_allowed:
                      errors.append(f"{sha} {header!r}: merge commits are not allowed; rebase instead")
                  continue
              for error in commit_message.validate(message.strip(), scopes):
                  errors.append(f"{sha} {header!r}: {error}")

          sys.exit(fail("invalid pull request commits", errors))
          EOF

  # Checks third_party/versions.md against the submodule commits recorded in
  # the tree and against the upstream release tags, and every license against
  # the allow-list. Runs directly on the runner: it needs only git.
  third-party:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Licenses are SPDX expressions, compared whole.
      - name: Versions manifest and licenses
        env:
          MANIFEST: third_party/versions.md
          ALLOWED_LICENSES: |-
            Apache-2.0
            Apache-2.0 WITH LLVM-exception
            BSD-2-Clause
            BSD-3-Clause
            MIT
            Zlib
            BSL-1.0
        run: |
          set -euo pipefail
          status=0
          fail() { echo "::error file=$MANIFEST::$*"; status=1; }
          cell() {
            local value=${1//\`/}
            value=${value#"${value%%[![:space:]]*}"}
            printf '%s' "${value%"${value##*[![:space:]]}"}"
          }

          # Table rows whose Path cell is code: | Name | `path` | ... |
          declare -A tags=() commits=() licenses=()
          while IFS='|' read -r _ name path tag commit license _; do
            path=$(cell "$path")
            if [[ -n "${tags[$path]+set}" ]]; then
              fail "$path is listed more than once"
            fi
            tags[$path]=$(cell "$tag")
            commits[$path]=$(cell "$commit")
            licenses[$path]=$(cell "$license")
            echo "Manifest: $(cell "$name") $path ${tags[$path]} ${commits[$path]} ${licenses[$path]}"
          done < <(grep -E '^\|[^|]*\|[[:space:]]*`' "$MANIFEST")

          # Every gitlink of the tree is a submodule listed in the manifest.
          declare -A gitlinks=()
          while read -r _ type sha path; do
            if [[ "$type" == commit ]]; then
              gitlinks[$path]=$sha
            fi
          done < <(git ls-tree -r HEAD)
          for path in "${!gitlinks[@]}"; do
            [[ -n "${tags[$path]+set}" ]] \
              || fail "submodule $path is missing from the manifest"
          done

          for path in "${!tags[@]}"; do
            tag=${tags[$path]}
            commit=${commits[$path]}
            license=${licenses[$path]}
            if ! grep -Fxq -- "$license" <<<"$ALLOWED_LICENSES"; then
              fail "$path: license '$license' is not on the allow-list"
            fi
            if [[ -z "${gitlinks[$path]+set}" ]]; then
              fail "$path is listed but is not a submodule"
              continue
            fi
            if [[ "$commit" != "${gitlinks[$path]}" ]]; then
              fail "$path: the manifest says $commit, the submodule is at ${gitlinks[$path]}"
            fi
            # The tag must exist upstream and point to that commit (peeled
            # when annotated).
            url=$(git config -f .gitmodules --get-regexp '^submodule\..*\.path$' \
              | awk -v p="$path" '$2 == p { print $1 }' \
              | sed -E 's/\.path$/.url/' | xargs -r git config -f .gitmodules --get || true)
            if [[ -z "$url" ]]; then
              fail "$path has no URL in .gitmodules"
              continue
            fi
            upstream=$(git ls-remote --tags "$url" "refs/tags/$tag" "refs/tags/$tag^{}" \
              | sort -k2 | awk 'END { print $1 }')
            if [[ -z "$upstream" ]]; then
              fail "$path: tag $tag does not exist in $url"
            elif [[ "$upstream" != "$commit" ]]; then
              fail "$path: tag $tag points to $upstream, not $commit"
            fi
          done
          exit "$status"
