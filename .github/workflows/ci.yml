name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Runs directly on the runner: it needs only Python 3 and the GitHub API,
  # not the toolchain image.
  conventions:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The devcontainer must pin the deps image built from the current
      # inputs. The deps workflow builds that image and commits the pin.
      - name: Compute the deps image tag
        id: deps-image
        uses: ./.github/actions/layer-image
        with:
          layer: deps

      - name: Devcontainer image pin
        env:
          REF: ${{ steps.deps-image.outputs.ref }}
          PIN_FILE: .devcontainer/devcontainer.json
        run: |
          pinned=$(sed -nE 's/^[[:space:]]*"image":[[:space:]]*"([^"]*)".*$/\1/p' "$PIN_FILE")
          if [[ "$pinned" != "$REF" ]]; then
            echo "::error file=$PIN_FILE::the pinned image '${pinned:-none}' is stale; the deps inputs hash to $REF. Let the deps workflow publish and pin it (or run it: gh workflow run deps.yml --ref <branch>), then pull."
            exit 1
          fi
          echo "$PIN_FILE pins $REF."

      # Dependabot names its branches dependabot/<ecosystem>/<dependency>.
      - name: Branch name
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: python3 -m checks.branch_name --pull-request "$HEAD_REF"

      # Features and bugfixes are squash-merged: the title becomes the commit
      # header on develop.
      - name: Pull request title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | python3 -m checks.commit_message -

      - name: Pull request commits
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/commits" \
            --jq '.[] | @json' > "$RUNNER_TEMP/commits.jsonl"
          python3 - "$RUNNER_TEMP/commits.jsonl" <<'EOF'
          import json
          import os
          import sys

          from checks import commit_message
          from checks import report

          # The pull request commits endpoint lists at most 250 commits.
          MAX_COMMITS = 250

          with open(sys.argv[1], encoding="utf-8") as lines:
              commits = [json.loads(line) for line in lines if line.strip()]

          # git flow back-merges main into develop with merge commits, so a
          # release or hotfix pull request into main may carry them; every
          # other history must be linear.
          merges_allowed = os.environ["BASE_REF"] == "main" and os.environ[
              "HEAD_REF"
          ].startswith(("release/", "hotfix/"))
          scopes = commit_message.allowed_scopes()

          errors = []
          if len(commits) >= MAX_COMMITS:
              errors.append(
                  f"the pull request has {len(commits)} commits or more; "
                  f"only the first {MAX_COMMITS} can be verified"
              )
          for commit in commits:
              sha = commit["sha"][:12]
              message = commit["commit"]["message"]
              header = message.split("\n", 1)[0]
              verification = commit["commit"]["verification"]
              if not verification["verified"]:
                  errors.append(
                      f"{sha} {header!r}: signature not verified by GitHub "
                      f"({verification['reason']})"
                  )
              if len(commit["parents"]) > 1:
                  if not merges_allowed:
                      errors.append(f"{sha} {header!r}: merge commits are not allowed; rebase instead")
                  continue
              for error in commit_message.validate(message.strip(), scopes):
                  errors.append(f"{sha} {header!r}: {error}")

          sys.exit(report.fail("invalid pull request commits", errors))
          EOF

  # Checks third_party/versions.md against the submodule commits recorded in
  # the tree and against the upstream release tags, and every license against
  # the allow-list. Runs directly on the runner: it needs only git.
  third-party:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Licenses are SPDX expressions, compared whole.
      - name: Versions manifest and licenses
        env:
          MANIFEST: third_party/versions.md
          ALLOWED_LICENSES: |-
            Apache-2.0
            Apache-2.0 WITH LLVM-exception
            BSD-2-Clause
            BSD-3-Clause
            MIT
            Zlib
            BSL-1.0
        run: |
          set -euo pipefail
          status=0
          fail() { echo "::error file=$MANIFEST::$*"; status=1; }
          cell() {
            local value=${1//\`/}
            value=${value#"${value%%[![:space:]]*}"}
            printf '%s' "${value%"${value##*[![:space:]]}"}"
          }

          # Table rows whose Path cell is code: | Name | `path` | ... |
          declare -A tags=() commits=() licenses=()
          while IFS='|' read -r _ name path tag commit license _; do
            path=$(cell "$path")
            if [[ -n "${tags[$path]+set}" ]]; then
              fail "$path is listed more than once"
            fi
            tags[$path]=$(cell "$tag")
            commits[$path]=$(cell "$commit")
            licenses[$path]=$(cell "$license")
            echo "Manifest: $(cell "$name") $path ${tags[$path]} ${commits[$path]} ${licenses[$path]}"
          done < <(grep -E '^\|[^|]*\|[[:space:]]*`' "$MANIFEST")

          # Every gitlink of the tree is a submodule listed in the manifest.
          declare -A gitlinks=()
          while read -r _ type sha path; do
            if [[ "$type" == commit ]]; then
              gitlinks[$path]=$sha
            fi
          done < <(git ls-tree -r HEAD)
          for path in "${!gitlinks[@]}"; do
            [[ -n "${tags[$path]+set}" ]] \
              || fail "submodule $path is missing from the manifest"
          done

          for path in "${!tags[@]}"; do
            tag=${tags[$path]}
            commit=${commits[$path]}
            license=${licenses[$path]}
            if ! grep -Fxq -- "$license" <<<"$ALLOWED_LICENSES"; then
              fail "$path: license '$license' is not on the allow-list"
            fi
            if [[ -z "${gitlinks[$path]+set}" ]]; then
              fail "$path is listed but is not a submodule"
              continue
            fi
            if [[ "$commit" != "${gitlinks[$path]}" ]]; then
              fail "$path: the manifest says $commit, the submodule is at ${gitlinks[$path]}"
            fi
            # The tag must exist upstream and point to that commit (peeled
            # when annotated).
            url=$(git config -f .gitmodules --get-regexp '^submodule\..*\.path$' \
              | awk -v p="$path" '$2 == p { print $1 }' \
              | sed -E 's/\.path$/.url/' | xargs -r git config -f .gitmodules --get || true)
            if [[ -z "$url" ]]; then
              fail "$path has no URL in .gitmodules"
              continue
            fi
            upstream=$(git ls-remote --tags "$url" "refs/tags/$tag" "refs/tags/$tag^{}" \
              | sort -k2 | awk 'END { print $1 }')
            if [[ -z "$upstream" ]]; then
              fail "$path: tag $tag does not exist in $url"
            elif [[ "$upstream" != "$commit" ]]; then
              fail "$path: tag $tag points to $upstream, not $commit"
            fi
          done
          exit "$status"

  # On release and hotfix pull requests: the version in the branch name must
  # equal the CMake project version and git-cliff's bumped version, and
  # CHANGELOG.md must have a dated section for it; every release tag must be
  # signed. git-cliff comes from the pinned deps image.
  release:
    if: >-
      github.event_name == 'pull_request'
      && (startsWith(github.head_ref, 'release/')
          || startsWith(github.head_ref, 'hotfix/'))
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    steps:
      # The whole history and the tags: git-cliff bumps from the last tag.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull the pinned image
        id: image
        run: |
          ref=$(sed -nE 's/^[[:space:]]*"image":[[:space:]]*"([^"]*)".*$/\1/p' \
            .devcontainer/devcontainer.json)
          if [[ -z "$ref" ]] || ! docker pull --quiet "$ref" >/dev/null 2>&1; then
            echo "::error title=Image missing::'$ref' is not published yet. Run the deps workflow on this branch, then re-run this job."
            exit 1
          fi
          echo "ref=$ref" >>"$GITHUB_OUTPUT"

      # Runs as the owner of the checkout, which git and git-cliff require.
      - name: Versions, changelog and tags
        env:
          HEAD_REF: ${{ github.head_ref }}
          IMAGE: ${{ steps.image.outputs.ref }}
        run: |
          docker run --rm -i --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -e HEAD_REF -v "$PWD:/repo" -w /repo "$IMAGE" bash -s <<'EOF'
          set -euo pipefail
          status=0
          fail() { echo "::error::$*"; status=1; }
          version=${HEAD_REF#*/}
          echo "Branch version: $version"

          cmake_version=
          if [[ -f CMakeLists.txt ]]; then
            cmake_version=$(tr '\n' ' ' <CMakeLists.txt | sed -nE \
              's/.*project\([[:space:]]*umbra[[:space:]][^)]*VERSION[[:space:]]+([0-9]+\.[0-9]+\.[0-9]+).*/\1/p')
          fi
          if [[ -z "$cmake_version" ]]; then
            fail "CMakeLists.txt declares no 'project(umbra VERSION X.Y.Z ...)'"
          elif [[ "$cmake_version" != "$version" ]]; then
            fail "the CMake project version is $cmake_version, the branch says $version"
          fi

          if ! bumped=$(git cliff --bumped-version); then
            fail "git cliff --bumped-version failed"
          elif [[ "${bumped#v}" != "$version" ]]; then
            fail "git-cliff bumps to ${bumped#v}, the branch says $version"
          fi

          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            fail "v$version is already tagged"
          fi

          heading="## [$version] - "
          date=$(grep -F -- "$heading" CHANGELOG.md | head -n1 \
            | cut -c$((${#heading} + 1))- || true)
          if [[ -z "$date" ]]; then
            fail "CHANGELOG.md has no '## [$version] - YYYY-MM-DD' section"
          elif ! [[ "$date" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] \
              || [[ "$(date -d "$date" +%F 2>/dev/null)" != "$date" ]]; then
            fail "the CHANGELOG.md section of $version has an invalid date: '$date'"
          fi

          # Only the presence of a signature is checked: no allowed-signers
          # file is committed.
          while read -r tag; do
            if [[ "$(git cat-file -t "$tag")" != tag ]]; then
              fail "release tag $tag is lightweight, so it is not signed"
            elif ! git cat-file tag "$tag" \
                | grep -Eq -- '^-----BEGIN (SSH|PGP) SIGNATURE-----$'; then
              fail "release tag $tag is not signed"
            fi
          done < <(git tag --list 'v[0-9]*.[0-9]*.[0-9]*')

          exit "$status"
          EOF

  # Resolves the deps image pinned in the devcontainer configuration, so that
  # the build jobs run in it, and fails clearly when it is not published yet.
  image:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    outputs:
      ref: ${{ steps.pin.outputs.ref }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pinned image
        id: pin
        env:
          PIN_FILE: .devcontainer/devcontainer.json
        run: |
          set -euo pipefail
          image_line='^[[:space:]]*"image":[[:space:]]*"([^"]*)".*$'
          ref=$(sed -nE "s/$image_line/\\1/p" "$PIN_FILE")
          if [[ -z "$ref" ]]; then
            echo "::error file=$PIN_FILE::no \"image\" line with the pinned image"
            exit 1
          fi
          if ! docker manifest inspect "$ref" >/dev/null 2>&1; then
            echo "::error title=Image missing::$ref is not published:" \
              "run the deps workflow on this branch to build it, then re-run CI"
            exit 1
          fi
          echo "ref=$ref" >>"$GITHUB_OUTPUT"

  build-debug:
    needs: image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.image.outputs.ref }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and test
        run: make test

  build-release:
    needs: image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.image.outputs.ref }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and test
        run: make release

  # ASan + UBSan (with pattern auto-var-init). As in the devcontainer, ptrace
  # and an unconfined seccomp profile let LeakSanitizer stop the process.
  sanitize-address:
    needs: image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.image.outputs.ref }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --cap-add SYS_PTRACE --security-opt seccomp=unconfined
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and test
        run: make asan

  # TSan. The unconfined seccomp profile lets TSan re-execute itself with
  # address space randomization disabled when the runner's randomization is
  # too strong for its memory layout.
  sanitize-thread:
    needs: image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.image.outputs.ref }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --cap-add SYS_PTRACE --security-opt seccomp=unconfined
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and test
        run: make tsan
