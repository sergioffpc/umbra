name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # `umbra-math` requires the `x86-64-v3` baseline (ADR 0023), and the CI
  # runners are generic x86-64.
  RUSTFLAGS: -D warnings -C target-cpu=x86-64-v3

# Job names are required status checks in the "Require CI checks" repository
# ruleset: when renaming or adding a job, update the ruleset too, or merges
# into develop and main stay blocked.
#
# The checks themselves live in scripts/check.sh, which contributors run
# locally too, and the tool versions in scripts/install-tools.sh, which the
# dev container uses too. Third-party actions are pinned to a commit SHA (tags
# can be moved); Dependabot updates the SHA and the version comment together.
jobs:
  check:
    name: fmt, clippy, doc, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Installs the toolchain pinned in rust-toolchain.toml.
      - name: Toolchain
        run: rustup toolchain install && rustc --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: scripts/install-tools.sh cargo-nextest
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # The tests include the hash of the RGB-to-spectrum table the
      # `umbra-spectrum` build script generates (ADR 0022).
      - run: scripts/check.sh rust

  # The `unsafe` SIMD backends of `umbra-math` under Miri (ADR 0007), on a
  # nightly pinned for this job only, with the `x86-64-v3` baseline the crate
  # requires. The equivalence tests sample fewer inputs under `cfg(miri)`.
  # Miri cannot run inline assembly, which `libm` uses for its runtime CPU
  # check, so `libm` is built with `force-soft-floats` (the same, correctly
  # rounded bits). The pbrt-v4 test ports are left out: their long loops take
  # hours under Miri, and the equivalence tests cover every `unsafe` item.
  miri:
    name: miri
    runs-on: ubuntu-latest
    env:
      MIRI_TOOLCHAIN: nightly-2026-11-05
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        run: >-
          rustup toolchain install "$MIRI_TOOLCHAIN" --profile minimal
          --component miri --component rust-src
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: miri
      - run: scripts/install-tools.sh cargo-nextest
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: >-
          cargo +"$MIRI_TOOLCHAIN" miri nextest run -p umbra-math --all-features
          --features libm/force-soft-floats --locked
          -E 'not test(/^pbrt_v4::/)'

  # Advisories are split out so a new RustSec advisory shows as its own
  # failing check, apart from the license and source policy.
  deny:
    name: cargo deny (${{ matrix.checks }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        checks: [advisories, bans licenses sources]
    steps:
      - uses: actions/checkout@v7
      - run: scripts/install-tools.sh cargo-deny
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: cargo deny check ${{ matrix.checks }}

  # Spelling, unused dependencies, and the linters of shell scripts, workflows,
  # EditorConfig, JSON, YAML, Markdown and TOML, on every tracked file.
  # shellcheck comes with the runner.
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: >-
          scripts/install-tools.sh typos cargo-shear actionlint
          editorconfig-checker taplo prettier markdownlint-cli2
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: scripts/check.sh lint
