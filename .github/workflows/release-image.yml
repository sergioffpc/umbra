name: Release image

# Builds the chiseled container image from the Dockerfile at the repository
# root once per Linux target CPU and publishes the images to
# ghcr.io/sergioffpc/umbra at the end of every release: the push of a vX.Y.Z
# tag on main (git flow, see CONTRIBUTING.md). Why a tag push rather than a
# published GitHub Release, and why amd64 only:
# docs/adr/0005-chiseled-release-container-image.md. Why one image per CPU and
# no `latest` tag: docs/adr/0012-per-cpu-binaries-locked-to-one-commit.md.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions: {}

# One run per tag; a re-run of the same tag waits instead of racing a push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

# Every action, first-party included, is pinned to a commit SHA (tags can be
# moved), since this workflow can publish; Dependabot updates the SHA and the
# version comment together.
#
# Both jobs run once per Linux Worker CPU (docs/architecture/07-deployment-view.md).
# Adding a machine with a new CPU means adding it to both matrices. `publish`
# needs every `build`, so no image of a release is pushed until the images for
# all CPUs have been built and smoke-tested.
jobs:
  build:
    name: build (${{ matrix.target-cpu }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target-cpu: [znver2, broadwell]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Full history and branches, to check the tag against main.
          fetch-depth: 0
          persist-credentials: false

      - name: Tag is a release on main
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME is not on main; push main first, then re-run this workflow."
            exit 1
          fi
          crate="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          if [ "$crate" != "$version" ]; then
            echo "::error::$GITHUB_REF_NAME does not match the crate version $crate in Cargo.toml."
            exit 1
          fi

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Build into the local image store and smoke-test it, so a broken image
      # is never published. The layers go to the GitHub Actions cache, one
      # scope per CPU, for the `publish` job to reuse. The smoke test runs the
      # binary on the runner's CPU, which must support the target CPU's
      # instructions.
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          build-args: TARGET_CPU=${{ matrix.target-cpu }}
          load: true
          tags: umbra:smoke
          cache-from: type=gha,scope=${{ matrix.target-cpu }}
          cache-to: type=gha,scope=${{ matrix.target-cpu }},mode=max

      - name: Smoke test
        run: |
          docker run --rm umbra:smoke --version
          test "$(docker image inspect umbra:smoke --format '{{.Config.User}}')" = "10001:10001"
          if docker run --rm --entrypoint /bin/sh umbra:smoke -c true 2>/dev/null; then
            echo "::error::the image has a shell"
            exit 1
          fi

  publish:
    name: publish (${{ matrix.target-cpu }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target-cpu: [znver2, broadwell]
    permissions:
      contents: read
      # Push to GHCR.
      packages: write
      # Sign and store the build provenance attestation.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # The only tag is X.Y.Z-<cpu>: the release version names the commit and
      # the suffix the CPU. No X.Y, `latest` or CPU-less tag, so no host can
      # pull a binary built for another CPU. Also the OCI labels and
      # annotations (source, revision, version, created, licenses, ...).
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=false
            suffix=-${{ matrix.target-cpu }}
          tags: |
            type=semver,pattern={{version}}
          labels: |
            org.opencontainers.image.title=umbra
            org.opencontainers.image.description=Umbra, a physically based ray tracer (chiseled Ubuntu, linux/amd64, target-cpu=${{ matrix.target-cpu }})
          annotations: |
            org.opencontainers.image.title=umbra
            org.opencontainers.image.description=Umbra, a physically based ray tracer (chiseled Ubuntu, linux/amd64, target-cpu=${{ matrix.target-cpu }})

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Rebuilds from the layers the `build` job cached for this CPU.
      # BuildKit attaches an SLSA provenance and an SPDX SBOM to the image.
      - id: push
        name: Push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          build-args: TARGET_CPU=${{ matrix.target-cpu }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.target-cpu }}

      # GitHub artifact attestation, verifiable with
      # `gh attestation verify oci://ghcr.io/sergioffpc/umbra:X.Y.Z-znver2 -R sergioffpc/umbra`.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Summary
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
          TARGET_CPU: ${{ matrix.target-cpu }}
        run: |
          {
            echo "## Container image ($TARGET_CPU)"
            echo
            echo "Digest: \`$DIGEST\`"
            echo
            echo '```text'
            echo "$TAGS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
