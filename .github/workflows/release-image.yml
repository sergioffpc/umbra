name: Release image

# Builds the chiseled container image from the Dockerfile at the repository
# root, for linux/amd64 (the x86-64-v3 baseline) and linux/arm64, and
# publishes it to ghcr.io/sergioffpc/umbra at the end of every release: the
# push of a vX.Y.Z tag on main (git flow, see CONTRIBUTING.md). Why a tag push
# rather than a published GitHub Release:
# docs/adr/0005-chiseled-release-container-image.md. Why one image per
# architecture's baseline and no `latest` tag:
# docs/adr/0025-one-x86-64-v3-release-image.md. The x86-64 runner builds the
# arm64 image under QEMU, which is slow but needs no second job to merge the
# two into one manifest.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions: {}

# One run per tag; a re-run of the same tag waits instead of racing a push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

# Every action, first-party included, is pinned to a commit SHA (tags can be
# moved), since this job can publish; Dependabot updates the SHA and the
# version comment together.
#
# One job builds, smoke-tests and pushes the image, so the image pushed is the
# one tested.
jobs:
  image:
    name: container image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Push to GHCR.
      packages: write
      # Sign and store the build provenance attestation.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history and branches, to check the tag against main.
          fetch-depth: 0
          persist-credentials: false

      - name: Tag is a release on main
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME is not on main; push main first, then re-run this workflow."
            exit 1
          fi
          crate="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          if [ "$crate" != "$version" ]; then
            echo "::error::$GITHUB_REF_NAME does not match the crate version $crate in Cargo.toml."
            exit 1
          fi

      # Runs the arm64 build and smoke test on the x86-64 runner.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # The only tag is X.Y.Z: the release version names the commit. No X.Y or
      # `latest`, which would move under a running Cluster and put its
      # Workers on different commits. Also the OCI labels and annotations
      # (source, revision, version, created, licenses, ...).
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
          labels: |
            org.opencontainers.image.title=umbra
            org.opencontainers.image.description=Umbra, a physically based ray tracer (chiseled Ubuntu, linux/amd64 x86-64-v3 and linux/arm64)
          annotations: |
            org.opencontainers.image.title=umbra
            org.opencontainers.image.description=Umbra, a physically based ray tracer (chiseled Ubuntu, linux/amd64 x86-64-v3 and linux/arm64)

      # Build each platform into the local image store first and smoke-test
      # it, so a broken image is never published. The local store holds one
      # platform per tag, hence one build each; the push below reuses their
      # cached layers.
      - name: Build (amd64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: umbra:smoke-amd64
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,mode=max,scope=amd64

      - name: Build (arm64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64
          load: true
          tags: umbra:smoke-arm64
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,mode=max,scope=arm64

      # GitHub's x86-64 runners have x86-64-v3, so the amd64 binary starts on
      # them; the arm64 one runs under QEMU.
      - name: Smoke test
        run: |
          for arch in amd64 arm64; do
            image="umbra:smoke-$arch"
            docker run --rm --platform "linux/$arch" "$image" --version
            test "$(docker image inspect "$image" --format '{{.Config.User}}')" = "10001:10001"
            if docker run --rm --platform "linux/$arch" --entrypoint /bin/sh "$image" -c true 2>/dev/null; then
              echo "::error::the $arch image has a shell"
              exit 1
            fi
          done

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # BuildKit attaches an SLSA provenance and an SPDX SBOM to the image.
      - id: push
        name: Push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: mode=max
          sbom: true
          cache-from: |
            type=gha,scope=amd64
            type=gha,scope=arm64

      # GitHub artifact attestation, verifiable with
      # `gh attestation verify oci://ghcr.io/sergioffpc/umbra:X.Y.Z -R sergioffpc/umbra`.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Summary
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "## Container image"
            echo
            echo "Digest: \`$DIGEST\`"
            echo
            echo '```text'
            echo "$TAGS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
