#
# Opens one pull request per submodule whose upstream has published a newer
# release tag, moving the submodule and its third_party/versions.md row
# together. Release tags are the tags shaped like the pinned one (same prefix,
# then X.Y.Z), so pre-releases are ignored. Dependabot handles only GitHub
# Actions: it would move submodules to branch heads, not release tags. The
# job runs python3 -m forge bump-submodules (forge/bump_submodules.py), which
# skips a submodule whose bump branch exists and labels the pull requests,
# creating the label when missing.
#
# The commit is created through the REST Git database API, which can record a
# submodule commit, so GitHub signs it. Branches and pull requests created
# with this token start no workflow runs: dispatch the deps workflow on the
# branch, which builds and pins the image and then dispatches CI on it.
name: submodules

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      pull-requests: write
    env:
      BASE: develop
      LABEL: dependencies
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.BASE }}
          persist-credentials: false

      - name: Open bump pull requests
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 -m forge bump-submodules --base "${BASE}" --label "${LABEL}"
